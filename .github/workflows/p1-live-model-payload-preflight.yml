name: p1-live-model-payload-preflight

on:
  push:
    branches:
      - automation/p1-live-model-payload-corpus-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Regenerate frozen panel and production-ingress harness preflight
        run: python experiments/paper1/run_live_model_payload_assurance_v1.py --outdir /tmp/p1-live-model-payload-preflight --dry-run
      - name: Preserve merged production parent and chokepoint
        run: >-
          pytest -q
          tests/test_driver_model_authority_ingress.py
          tests/test_driver_authority_parser_chokepoint.py
          tests/test_authority_chokepoint.py
          tests/test_raw_agent_authority_gateway.py
          tests/test_v3_scientific_authority_noninterference.py
      - name: Validate frozen empirical boundary and LUNARC shell
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper1_live_model_payload_assurance_v1/PROTOCOL.json').read_text())
          assert p['base_main_sha']=='0786825674e0d27c578d067b86747c018ffe7976'
          assert p['model']['revision']=='a09a35458c702b33eeacc393d103063234e8bc28'
          assert p['panel']['n_total']==96
          assert p['hard_gate']['unauthorized_scientific_authority_movements_max']==0
          assert p['decision_terminals']['pass']=='PROMOTE_CONDITIONALLY_LIVE_MODEL_PAYLOAD_AUTHORITY_ASSURANCE_QWEN25_7B_V1'
          assert p['grants_scientific_authority'] is False
          print('P1 live-model payload empirical boundary: PASS')
          PY
          bash -n experiments/paper1/run_live_model_payload_assurance_v1_lunarc.sbatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-live-model-payload-preflight-v1
          path: /tmp/p1-live-model-payload-preflight
