name: p3-target-validation-consolidation

on:
  push:
    branches:
      - automation/p3-target-validation-consolidation-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run frozen consolidation and parent-contract suites
        run: >-
          pytest -q
          tests/test_semantic_shortcut_consolidation.py
          tests/test_semantic_shortcut.py
          tests/test_episode_storage_admission.py
          tests/test_experience_learning.py
          tests/test_v3_runtime.py
      - name: Preserve authority and negative-history boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper3_target_validation_consolidation_v1/PROTOCOL.json').read_text())
          assert p['promotion_if_green']=='PROMOTE_CONDITIONALLY_PRODUCTION_TARGET_VALIDATION_CONSOLIDATION'
          assert '#401 CANNOT_EXECUTE_MATCHED_EVAL' in p['preserved_negatives']
          assert 'ResearchTool promotion' in p['nonclaims']
          assert 'scientific/theorem authority' in p['nonclaims']
          print('P3 target-validation consolidation boundary: PASS')
          PY
