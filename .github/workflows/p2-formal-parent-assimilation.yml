name: p2-formal-parent-assimilation

on:
  push:
    branches:
      - automation/p2-formal-parent-assimilation-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parent-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Strongest-parent arbitration + existing P2 parents
        run: >-
          pytest -q
          tests/test_transfer_parent_assimilation.py
          tests/test_objective_benchmark_v2.py
          tests/test_controlled_witness_extraction.py
      - name: Enforce frozen claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper2_formal_parent_assimilation_v1/PROTOCOL.json').read_text())
          assert p['promotion_if_green']=='PROMOTE_CONDITIONALLY_FORMAL_PARENT_ASSIMILATION_BOUNDARY'
          assert p['orion_child']['allowed_only_after_parent_out_of_scope'] is True
          assert p['grants_scientific_authority'] is False
          assert 'ORION improves on sID within fully specified causal transportability scope' in p['explicit_nonclaims']
          print('P2 formal-parent assimilation boundary: PASS')
          PY
