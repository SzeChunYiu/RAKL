name: p1-agent-output-authority-firewall

on:
  push:
    branches:
      - automation/p1-p4-claim-frontier-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Untrusted raw/gateway + protected-parent suite
        run: >-
          pytest -q
          tests/test_agent_authority_gateway.py
          tests/test_raw_agent_authority_gateway.py
          tests/test_v3_scientific_authority_noninterference.py
          tests/test_epistemic_noninterference.py
      - name: Enforce authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p1=json.loads(Path('research/paper1_agent_output_authority_firewall_v1/PROTOCOL.json').read_text())
          p2=json.loads(Path('research/paper1_raw_agent_json_firewall_v1/PROTOCOL.json').read_text())
          assert p1['promotion_if_green']=='PROMOTE_CONDITIONALLY_AGENT_OUTPUT_AUTHORITY_FIREWALL'
          assert p2['promotion_if_green']=='PROMOTE_CONDITIONALLY_RAW_AGENT_JSON_AUTHORITY_FIREWALL'
          assert p1['grants_scientific_authority'] is False
          assert p2['grants_scientific_authority'] is False
          print('P1 raw agent-output authority firewall: promotion gate PASS')
          PY
