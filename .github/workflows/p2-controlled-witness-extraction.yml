name: p2-controlled-witness-extraction

on:
  push:
    branches:
      - automation/p1-p4-claim-frontier-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  controlled-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Unit and fail-closed interface tests
        run: pytest -q tests/test_controlled_witness_extraction.py
      - name: Execute frozen fresh extraction panel
        run: python experiments/paper2/run_controlled_witness_extraction_v1.py --out /tmp/p2-controlled-extraction
      - name: Enforce promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/p2-controlled-extraction/FINAL_RECEIPT.json').read_text())
          assert r['all_gates_pass'] is True
          assert r['terminal']=='PROMOTE_CONDITIONALLY_CONTROLLED_TEXT_STRUCTURAL_WITNESS_EXTRACTION'
          assert r['full_controlled_extractor']['invalid_false_accept']==0.0
          assert r['full_controlled_extractor']['cannot_check_recall']>=0.99
          assert r['strongest_parent_exact']<=0.95
          assert r['all_mutations_caught'] is True
          assert r['grants_scientific_authority'] is False
          print('P2 controlled-text witness extraction: PROMOTION GATE PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-controlled-witness-extraction-v1
          path: /tmp/p2-controlled-extraction/FINAL_RECEIPT.json
