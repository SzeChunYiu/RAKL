name: p3-capability-scoring-hardening-v2

on:
  push:
    branches:
      - automation/p3-capability-scoring-hardening-v2-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scoring-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[test]'
      - name: Verify unchanged qualification scientific subjects
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          packet=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION')
          freeze=json.loads((packet/'STAGE3_5_FREEZE_V1.json').read_text())
          manifest=json.loads((packet/'FRESH_TASK_MANIFEST_V1.json').read_text())
          hard=json.loads((packet/'STAGE3_5_SCORING_HARDENING_V2.json').read_text())
          assert manifest['panel_sha256']=='0ab994fb0f8f3523014023ff703151afe4c66e86a8f030435f509d141055cc0e'
          assert freeze['model_candidates'][0]['revision']=='a09a35458c702b33eeacc393d103063234e8bc28'
          assert freeze['interface']['repair_passes']==0
          assert hard['chronology']['model_outputs_accessed_before_freeze'] is False
          assert hard['unchanged_subjects']['vector_thresholds'].startswith('unchanged')
          assert not (packet/'CAPABLE_MODEL_AUTHORIZE_RECEIPT_V3.json').exists()
          print('scientific subjects unchanged; no qualification authorization receipt present')
          PY
      - name: Reproduce unchanged fresh panel and shortcut audit under v2
        run: python experiments/paper3/run_capability_stage4_v2.py --outdir /tmp/p3-cap-scoring-v2 --dry-run
      - name: Prove v1 denominator evasion and v2 fail-closed repair
        run: python -m pytest -q tests/test_p3_capability_scoring_hardening_v2.py
      - name: Validate exact LUNARC successor shell
        run: bash -n experiments/paper3/run_capability_stage4_v2_lunarc.sbatch
