name: p1-live-model-payload-freeze-hardening-v2

on:
  push:
    branches:
      - automation/p1-live-payload-freeze-hardening-v2-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  freeze-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original frozen source blobs
        run: |
          test "$(git hash-object experiments/paper1/build_live_model_payload_panel_v1.py)" = 9fc9434aa6e4cbb797265c350371ee3f9eddedcf
          test "$(git hash-object experiments/paper1/run_live_model_payload_assurance_v1.py)" = 8a902d236ba9d1869f9292ca00c6d6f5bdda98e3
          test "$(git hash-object experiments/paper1/run_live_model_payload_assurance_v1_lunarc.sbatch)" = 5024bbe77776e8a06fc32165e025a4897630d453
          test "$(git hash-object research/paper1_live_model_payload_assurance_v1/PROTOCOL.json)" = 2e7f37d6a3524870af8d439147a5bc1a4646734b
      - name: Reproduce exact 96-case panel bytes before any model output
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          hard=json.loads(Path('research/paper1_live_model_payload_assurance_v1/FREEZE_HARDENING_V2.json').read_text())
          path=Path('experiments/paper1/build_live_model_payload_panel_v1.py')
          spec=importlib.util.spec_from_file_location('p1panel', path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          rows=mod.build(hard['frozen_panel']['seed'], hard['frozen_panel']['cases_per_family'])
          body=mod.serialize(rows)
          assert len(rows)==hard['frozen_panel']['n']==96
          assert len(body)==hard['frozen_panel']['panel_bytes']==148332
          assert hashlib.sha256(body).hexdigest()==hard['frozen_panel']['panel_sha256']=='5af33abe503d0531f933a37f769932510c76c6144be3d23fc241bd670645ff81'
          assert hard['grants_scientific_authority'] is False
          print('P1 exact frozen panel identity: PASS')
          PY
      - name: Re-run deterministic production-ingress pre-model harness
        run: |
          python -m pip install -e '.[test]'
          rm -rf /tmp/p1-live-model-freeze-v2
          python experiments/paper1/run_live_model_payload_assurance_v1.py --outdir /tmp/p1-live-model-freeze-v2 --dry-run
      - name: Preserve authority parent and execution shell
        run: |
          pytest -q tests/test_driver_model_authority_ingress.py tests/test_driver_authority_parser_chokepoint.py tests/test_authority_chokepoint.py tests/test_raw_agent_authority_gateway.py tests/test_v3_scientific_authority_noninterference.py
          bash -n experiments/paper1/run_live_model_payload_assurance_v1_lunarc.sbatch
      - name: Enforce non-authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('research/paper1_live_model_payload_assurance_v1/FREEZE_HARDENING_V2.json').read_text())
          assert h['claim_boundary']=='PREOUTCOME_FREEZE_IDENTITY_HARDENING_ONLY__NO_LIVE_MODEL_RESULT__NO_SCIENTIFIC_AUTHORITY'
          assert h['scientific_settings_unchanged']['hard_gate_unchanged'] is True
          assert h['scientific_settings_unchanged']['usability_gate_unchanged'] is True
          assert h['scientific_settings_unchanged']['stress_coverage_gate_unchanged'] is True
          assert h['grants_scientific_authority'] is False
          print('P1 freeze hardening v2: PASS')
          PY
