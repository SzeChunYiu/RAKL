name: paper3-v2-source-id-repair

on:
  push:
    branches:
      - publication/paper3-v2-source-id-repair-20260810
  pull_request:
    branches:
      - main

jobs:
  source-id-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to evaluated subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[test]"
          pip install "jsonschema==4.25.1"
      - name: Verify negative history, neutral identifiers and closed compute gate
        run: |
          pytest -q \
            tests/test_paper3_v2_source_set.py \
            tests/test_paper3_v2_source_set_repair.py
      - name: Install Paper 3 manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
      - name: Compile exact Paper 3 v4 manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper/structural_amortization
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main_v4.tex | tee latexmk_v4_source_repair.stdout.log
          test -s main_v4.pdf
          if grep -E 'Overfull \[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main_v4.log; then
            echo "Blocking Paper 3 v4 LaTeX/PDF warning detected" >&2
            exit 1
          fi
      - name: Upload exact repair artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper3-v2-source-id-repair-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            research/paper3/annotation/SOURCE_ITEM_SET_V2_1_20260810.json
            research/receipts/PAPER3_V2_SOURCE_ID_REPAIR_20260810.json
            research/receipts/PAPER3_V2_SOURCE_ID_REPAIR_INTERNAL_REVIEW_20260810.json
            paper/structural_amortization/main_v4.pdf
            paper/structural_amortization/main_v4.log
            paper/structural_amortization/latexmk_v4_source_repair.stdout.log
          if-no-files-found: error
