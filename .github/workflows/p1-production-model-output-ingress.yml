name: p1-production-model-output-ingress

on:
  push:
    branches:
      - automation/p1-model-output-ingress-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Production authority choke-point audit
        run: python scripts/check_authority_chokepoints.py | tee /tmp/p1-production-model-output-ingress.json
      - name: Frozen successor and strongest-parent suite
        run: >-
          pytest -q
          tests/test_driver_model_authority_ingress.py
          tests/test_driver_authority_parser_chokepoint.py
          tests/test_rakl_v3_driver_learning.py
          tests/test_authority_chokepoint.py
          tests/test_agent_authority_gateway.py
          tests/test_raw_agent_authority_gateway.py
          tests/test_v3_scientific_authority_noninterference.py
          tests/test_epistemic_noninterference.py
      - name: Enforce pre-outcome claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper1_production_model_output_ingress_v1/PROTOCOL.json').read_text())
          assert p['base_main_sha']=='09c67e4afe5708d76a860ce90cb069d630bce05d'
          assert p['promotion_if_green']=='PROMOTE_CONDITIONALLY_PRODUCTION_DRIVER_OUTPUT_AUTHORITY_ISOLATION'
          assert p['anti_overclaim']['live_external_model_corpus_required_for_live_model_assurance'] is True
          assert p['grants_scientific_authority'] is False
          print('P1 production model-output authority isolation boundary: PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-production-model-output-ingress-v1
          path: /tmp/p1-production-model-output-ingress.json
