name: artifact-contract-coverage

on:
  push:
    paths:
      - "schemas/**"
      - "src/rakl/**"
      - "tests/test_artifact_contract_*.py"
      - ".github/workflows/artifact-contract-coverage.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "src/rakl/**"
      - "tests/test_artifact_contract_*.py"
      - ".github/workflows/artifact-contract-coverage.yml"

jobs:
  artifact-contract-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind checkout to evaluated subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Run planted-world artifact-contract coverage tests
        run: |
          pytest -q \
            tests/test_artifact_contract_coverage.py \
            tests/test_artifact_contract_triad_checker.py
      - name: Stdlib triad checker (schema+hash+test before promotion credit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/receipts
          python -m rakl.artifact_contract_coverage \
            --repo . \
            --json research/receipts/ARTIFACT_CONTRACT_TRIAD_COVERAGE.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path("research/receipts/ARTIFACT_CONTRACT_TRIAD_COVERAGE.json").read_text(
                  encoding="utf-8"
              )
          )
          assert data["verdict"] == "ALL_TRIADS_SATISFIED"
          assert data["permits_promotion_credit"] is True
          assert data["grants_framework_authority"] is False
          assert data["check_name"] == "artifact-contract-coverage"
          print(json.dumps({
              "verdict": data["verdict"],
              "finding_count": len(data["findings"]),
              "permits_promotion_credit": data["permits_promotion_credit"],
          }, indent=2))
          PY
