name: closeout-paper2-diagnostics

on:
  push:
    branches:
      - paper/closeout-rakl-framework-20260810
  pull_request:
    branches:
      - main
      - paper/round050-saturated-epistemic-mechanics

    paths:
      - 'paper/**'
      - 'publication/**'
      - 'src/rakl/**'
      - 'tests/test_epistemic*'
      - 'tests/test_saturated*'
      - 'research/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/closeout-paper2-diagnostics.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run affected Paper 2 tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_epistemic_benchmark.py tests/test_saturated_paper_source.py tests/test_saturated_paper_build.py | tee targeted-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|ERROR|E   |AssertionError|ValueError|RuntimeError' targeted-pytest.log | head -60 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 2 targeted pytest::$safe"
            done
            exit "$status"
          fi
      - name: Generate fresh receipt-bound figures
        run: |
          python -m rakl.mini_research_metrology
          python -m rakl.mini_archive_demo
          python paper/generate_demo_figures.py
      - name: Install manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern
      - name: Build chaptered Paper 2 and expose LaTeX failure
        shell: bash
        run: |
          set -euo pipefail
          python paper/build_saturated_epistemic_mechanics.py \
            --stage paper/build/closeout_saturated_epistemic \
            --subject-sha "$(git rev-parse HEAD)" \
            --software-tests 1
          grep -F '"fig5_demo_growth.pdf"' paper/build/closeout_saturated_epistemic/BUILD_MANIFEST.json
          cd paper/build/closeout_saturated_epistemic
          set +e
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -n -E '^!|LaTeX Error|Undefined control sequence|Emergency stop|Fatal error|Missing \\$ inserted|^[^ ]+\.tex:[0-9]+:' main.log || true; } | head -60 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 2 LaTeX::$safe"
            done
            tail -100 main.log
            exit "$status"
          fi
          test -s main.pdf
