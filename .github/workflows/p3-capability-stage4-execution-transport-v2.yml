name: p3-capability-stage4-execution-transport-v2

on:
  push:
    branches:
      - automation/p3-capability-scoring-hardening-v2-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execution-transport-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[test]'
      - name: Validate scoring-v2 shell and frozen blobs
        run: |
          bash -n experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v2.sh
          bash experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v2.sh \
            preflight "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE"
      - name: Simulate exact scoring-v2 submission and successful negative harvest
        run: |
          mkdir -p /tmp/fakebin
          cat >/tmp/fakebin/sbatch <<'SH'
          #!/usr/bin/env bash
          echo '525252;fakecluster'
          SH
          cat >/tmp/fakebin/sacct <<'SH'
          #!/usr/bin/env bash
          echo 'COMPLETED|'
          SH
          chmod +x /tmp/fakebin/sbatch /tmp/fakebin/sacct
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v2.sh
          bash "$SCRIPT" submit "$SUBJECT" "$GITHUB_WORKSPACE"
          mkdir -p research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          packet=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION')
          spec=packet/'STAGE3_5_SCORING_HARDENING_V2.json'
          p=packet/'STAGE4_SCORING_V2_RUN_525252'/'FINAL_CAPABILITY_RECEIPT.json'
          p.write_text(json.dumps({
            'schema_version':'rakl-capability-qualification-stage5-result-v2',
            'terminal':'DIAGNOSTIC_OVERFIT_OR_INSUFFICIENT_CAPABILITY',
            'model':{'revision':'a09a35458c702b33eeacc393d103063234e8bc28'},
            'panel_sha256':'0ab994fb0f8f3523014023ff703151afe4c66e86a8f030435f509d141055cc0e',
            'model_substitution_performed':False,
            'grants_scientific_authority':False,
            'all_132_cases_completed':True,
            'scoring_hardening':{
              'spec_sha256':hashlib.sha256(spec.read_bytes()).hexdigest(),
              'thresholds_changed_from_v1':False,
              'panel_changed_from_v1':False,
              'model_or_interface_changed_from_v1':False,
            },
          }, sort_keys=True)+'\n')
          PY
          bash "$SCRIPT" harvest 525252 "$SUBJECT" "$GITHUB_WORKSPACE"
          test -f research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/EXECUTION_TRANSPORT_V2/HARVEST_525252.json
      - name: Hostile harvest mutations must fail closed
        run: |
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v2.sh
          RAW=research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252/FINAL_CAPABILITY_RECEIPT.json
          cp "$RAW" /tmp/good-v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['schema_version']='rakl-capability-qualification-stage5-result-v1'; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 525252 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'v1 schema escaped' >&2; exit 1; fi
          cp /tmp/good-v2.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['scoring_hardening']['spec_sha256']='0'*64; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 525252 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'scoring spec mutation escaped' >&2; exit 1; fi
          cp /tmp/good-v2.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['panel_sha256']='0'*64; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 525252 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'panel mutation escaped' >&2; exit 1; fi
          cp /tmp/good-v2.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_SCORING_V2_RUN_525252/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['model']['revision']='wrong'; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 525252 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'model mutation escaped' >&2; exit 1; fi
          cp /tmp/good-v2.json "$RAW"
      - name: Scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_EXECUTION_TRANSPORT_V2.json').read_text())
          assert p['grants_scientific_authority'] is False
          assert p['grants_model_level_efficacy'] is False
          assert p['fixed_scientific_subject']['scoring_contract']=='STAGE3_5_SCORING_HARDENING_V2'
          assert p['fixed_scientific_subject']['numeric_thresholds_changed_from_v1'] is False
          assert 'SCORING_V2_REQUIRED' in p['claim_boundary']
          print('P3 Stage4 execution transport v2: PASS')
          PY
