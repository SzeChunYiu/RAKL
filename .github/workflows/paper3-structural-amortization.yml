name: paper3-structural-amortization

on:
  push:
    branches:
      - paper/structural-amortization-v0
      - publication/paper3-cheap-gate-20260810
  pull_request:
    branches:
      - main

    paths:
      - 'paper/structural_amortization/**'
      - 'src/rakl/**'
      - 'tests/test_structural*'
      - 'tests/test_amortization*'
      - 'tests/test_paper3_*'
      - 'research/receipts/PAPER3_*'
      - 'research/PAPER3_*'
      - 'pyproject.toml'
      - '.github/workflows/paper3-structural-amortization.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paper3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run Paper 3 mechanism and source tests
        run: |
          pytest -q \
            tests/test_structural_transfer.py \
            tests/test_structural_benchmark_receipt.py \
            tests/test_amortization.py \
            tests/test_paper3_cheap_gate.py \
            tests/test_structural_amortization_paper.py
      - name: Emit exact-subject structural benchmark receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/receipts
          python -m rakl.structural_benchmark_receipt \
            --output research/receipts/PAPER3_STRUCTURAL_BENCHMARK.json \
            --subject-sha "$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/receipts/PAPER3_STRUCTURAL_BENCHMARK.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['cheap_mechanism_gate_passed'] is True
          assert data['q2_all_licensed'] is True
          assert data['q3_all_rejected'] is True
          print(json.dumps({k: data[k] for k in (
              'subject_sha', 'case_count', 'hard_case_count',
              'semantic_only_hard_case_accuracy',
              'structural_gate_hard_case_accuracy',
              'cheap_mechanism_gate_passed')}, indent=2))
          PY
      - name: Verify frozen Paper 3 cheap-gate receipt and figure
        shell: bash
        run: |
          set -euo pipefail
          checked=research/receipts/PAPER3_CHEAP_GATE_RESULT_20260810.json
          subject="$(python -c 'import json; print(json.load(open("research/receipts/PAPER3_CHEAP_GATE_RESULT_20260810.json"))["subject_sha"])')"
          python -m rakl.paper3_cheap_gate \
            --benchmark research/PAPER3_CHEAP_GATE_BENCHMARK_PROPOSAL_20260810.json \
            --protocol research/PAPER3_CHEAP_GATE_PROTOCOL_20260810.json \
            --subject-sha "$subject" \
            --output /tmp/PAPER3_CHEAP_GATE_RESULT.json
          python - <<'PY'
          import json
          import math
          checked = json.load(open('research/receipts/PAPER3_CHEAP_GATE_RESULT_20260810.json'))
          rerun = json.load(open('/tmp/PAPER3_CHEAP_GATE_RESULT.json'))
          def assert_reproducible(left, right, path='receipt'):
              if isinstance(left, bool) or isinstance(right, bool):
                  assert left is right, path
              elif isinstance(left, (int, float)) and isinstance(right, (int, float)):
                  assert math.isclose(left, right, rel_tol=0.0, abs_tol=1e-12), path
              elif isinstance(left, dict) and isinstance(right, dict):
                  assert left.keys() == right.keys(), path
                  for key in left:
                      assert_reproducible(left[key], right[key], f'{path}.{key}')
              elif isinstance(left, list) and isinstance(right, list):
                  assert len(left) == len(right), path
                  for index, (a, b) in enumerate(zip(left, right)):
                      assert_reproducible(a, b, f'{path}[{index}]')
              else:
                  assert left == right, path
          for key in (
              'subject_sha', 'protocol_sha256', 'benchmark_sha256', 'split',
              'family_count', 'case_count', 'arm_metrics', 'predictions',
              'annotation_gate', 'diagnostic_signal_gate',
              'overall_cheap_gate_passed', 'expensive_training_authorized',
              'gate_verdict', 'negative_history'):
              assert_reproducible(checked[key], rerun[key], key)
          assert checked['gate_verdict'] == 'FAIL_CLOSED_MISSING_INDEPENDENT_ANNOTATION'
          assert checked['expensive_training_authorized'] is False
          print('frozen cheap-gate receipt: PASS (fail closed as registered)')
          PY
          python -m rakl.paper3_cheap_gate_figure \
            --receipt "$checked" \
            --output-prefix /tmp/paper3_cheap_gate_internal
          test -s /tmp/paper3_cheap_gate_internal.pdf
          test -s /tmp/paper3_cheap_gate_internal.svg
          test -s /tmp/paper3_cheap_gate_internal.png
      - name: Install manuscript build tools (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
          version: 1.1
      - name: Compile Paper 3 scaffold
        shell: bash
        run: |
          set +e
          cd paper/structural_amortization
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -n -E '^!|LaTeX Error|Undefined control sequence|Emergency stop|Fatal error|^[^ ]+\.tex:[0-9]+:' main.log || true; } | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 3 LaTeX::$safe"
            done
            exit "$status"
          fi
          test -s main.pdf
          if grep -E 'Overfull \\[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main.log; then
            echo "Blocking Paper 3 LaTeX/PDF warning detected" >&2
            exit 1
          fi
      - name: Upload Paper 3 conformance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper3-structural-conformance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            research/receipts/PAPER3_STRUCTURAL_BENCHMARK.json
            research/receipts/PAPER3_CHEAP_GATE_RESULT_20260810.json
            research/receipts/PAPER3_CHEAP_GATE_INTERNAL_REVIEW_20260810.json
            paper/structural_amortization/figures/paper3_cheap_gate_internal.pdf
            paper/structural_amortization/figures/paper3_cheap_gate_internal.svg
            paper/structural_amortization/figures/paper3_cheap_gate_internal.png
            paper/structural_amortization/main.pdf
            paper/structural_amortization/main.log
            paper/structural_amortization/latexmk.stdout.log
          if-no-files-found: error
