name: paper3-structural-amortization

on:
  push:
    branches:
      - paper/structural-amortization-v0
  pull_request:
    branches:
      - main

jobs:
  paper3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Run Paper 3 mechanism and source tests
        run: |
          pytest -q tests/test_structural_transfer.py tests/test_amortization.py tests/test_structural_amortization_paper.py
      - name: Install manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
      - name: Compile Paper 3 scaffold
        shell: bash
        run: |
          set +e
          cd paper/structural_amortization
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -n -E '^!|LaTeX Error|Undefined control sequence|Emergency stop|Fatal error|^[^ ]+\.tex:[0-9]+:' main.log || true; } | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 3 LaTeX::$safe"
            done
            exit "$status"
          fi
          test -s main.pdf
