name: p4-adaptive-receipt-admission

on:
  push:
    branches:
      - automation/p4-adaptive-receipt-admission-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  canonical-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run frozen successor and strongest-parent contracts
        run: >-
          pytest -q
          tests/test_phase2_adaptive_receipt_admission.py
          tests/test_phase2_adaptive_receipt_cost_boundary.py
          tests/test_training_policy_authority.py
          tests/test_training_scheduler.py
          tests/test_phase2_adaptive_protocol.py
      - name: Verify frozen evaluator and preserved negative identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected_git_blobs = {
              'research/orion_p1_p4_closure_v2/P4_ADAPTIVE_DEVELOPMENT_NEGATIVE.json': 'fc5d2363de1a6f1303ca9a80795fc291fe57a5a6',
              'research/paper4_phase2_v1/PROTOCOL_V3.json': '0ca5aa15dc078ec92e82ab4aff94e5ffcf16b0af',
              'research/paper4_phase2_v1/INFERENCE_PLAN.json': '2d31897ea6441d280519276e0f1fb3323bf03f99',
              'experiments/training_ladder/phase2_adaptive_v1.py': '5ade3b9fea3fc029870782d1157a867bc4feb700',
          }
          for name, expected in expected_git_blobs.items():
              data = Path(name).read_bytes()
              observed = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert observed == expected, (name, observed, expected)
          print('P4 frozen evaluator/protocol/negative identities: PASS')
          PY
      - name: Assert successor authority boundary
        run: |
          python - <<'PY'
          from rakl.training_policy_authority import choose_active_training_policy_from_phase2_bundle, TrainingPolicyMode
          d = choose_active_training_policy_from_phase2_bundle()
          assert d.mode is TrainingPolicyMode.STATIC_STRUCTURAL
          assert d.grants_scientific_authority is False
          print('P4 adaptive receipt admission authority boundary: PASS')
          PY
