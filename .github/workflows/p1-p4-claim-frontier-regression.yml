name: p1-p4-claim-frontier-regression

on:
  push:
    branches:
      - automation/p1-p4-claim-frontier-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Full repository tests
        run: pytest -q
      - name: Re-run frontier deterministic preflights
        run: |
          python experiments/paper2/run_controlled_witness_extraction_v1.py --out /tmp/p2-frontier
          python experiments/paper3/run_capability_stage4_v1.py --outdir /tmp/p3-frontier --dry-run
          bash -n experiments/paper3/run_capability_stage4_v1_lunarc.sbatch
          bash -n experiments/training_ladder/run_phase2_v1_lunarc.sbatch
      - name: Enforce no frontier artifact grants scientific authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[
            Path('research/orion_claim_frontier_v1/CLAIM_FRONTIER.json'),
            Path('research/paper1_agent_output_authority_firewall_v1/PROTOCOL.json'),
            Path('research/paper1_raw_agent_json_firewall_v1/PROTOCOL.json'),
            Path('research/paper2_controlled_witness_extraction_v1/PROTOCOL.json'),
            Path('research/paper2_real_source_descriptor_v1/PROTOCOL.json'),
            Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE3_5_FREEZE_V1.json'),
            Path('research/paper4_parent_assimilation_v1/PROTOCOL.json'),
          ]
          for path in paths:
              obj=json.loads(path.read_text())
              if 'grants_scientific_authority' in obj:
                  assert obj['grants_scientific_authority'] is False, path
          print('claim-frontier authority boundary: PASS')
          PY
