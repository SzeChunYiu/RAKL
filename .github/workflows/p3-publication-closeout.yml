name: p3-publication-closeout

on:
  push:
    branches:
      - automation/p3-publication-closeout-v1-20260814
  pull_request:
    branches:
      - automation/p3-glue-rejection-v1-20260814

permissions:
  contents: read

jobs:
  paper3-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
      - name: Bind exact manuscript subject
        run: test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
      - name: Verify integrated target-validation source blobs
        run: |
          test "$(git hash-object .github/workflows/p3-target-validation-consolidation.yml)" = "a500ebbfb6a9604a4a75ebb1b89887a06724d2ec"
          test "$(git hash-object research/paper3_target_validation_consolidation_v1/PROTOCOL.json)" = "58a674361dad93f01482952b2806da95988a1903"
          test "$(git hash-object src/rakl/semantic_shortcut_consolidation.py)" = "873aa7127d8c5a0a4bd675cb706452165a7a1942"
          test "$(git hash-object tests/test_semantic_shortcut_consolidation.py)" = "82abaae90936d1980e6eba55c657e012a0cf571b"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run integrated routing, consolidation and authority suites
        run: >-
          pytest -q
          tests/test_semantic_shortcut.py
          tests/test_semantic_shortcut_router.py
          tests/test_semantic_shortcut_router_v2.py
          tests/test_semantic_shortcut_router_v3.py
          tests/test_semantic_shortcut_consolidation.py
          tests/test_episode_storage_admission.py
          tests/test_rakl_v3_experience_substrate.py
          tests/test_episode_admission_runtime_wiring.py
          tests/test_rakl_v3_authority_hardening.py
      - name: Enforce closeout dependency, terminal and negative-history boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          protocol=json.loads(Path('research/paper3_publication_closeout_v2/PROTOCOL.json').read_text())
          matrix=json.loads(Path('research/paper3_publication_closeout_v2/MECHANIC_PROMOTION_MATRIX.json').read_text())
          candidate=json.loads(Path('research/paper3_publication_closeout_v2/CANDIDATE_RECEIPT.json').read_text())
          final=json.loads(Path('research/paper3_publication_closeout_v2/FINAL_RECEIPT.json').read_text())
          assert protocol['promotion_if_all_gates_green']=='PROMOTE_CONDITIONALLY_PAPER3_PUBLICATION_CLOSEOUT'
          assert matrix['added_coordinate']['terminal']=='PROMOTE_CONDITIONALLY_PRODUCTION_TARGET_VALIDATION_CONSOLIDATION'
          assert matrix['added_coordinate']['source_subject']['head_sha']=='e8e01805c05a1e9dd75238381288fa8ffd15f506'
          assert matrix['added_coordinate']['source_subject']['dedicated_ci']=='SUCCESS'
          assert matrix['open_proposal_only_coordinates']==[]
          assert matrix['all_known_paper3_framework_coordinates_promotion_grade_closed'] is True
          assert candidate['status']=='CANNOT_CHECK_PENDING_INTEGRATED_CLOSEOUT_CI'
          assert final['terminal']=='PROMOTE_CONDITIONALLY_PAPER3_PUBLICATION_CLOSEOUT'
          assert final['evidence_subject']['head_sha']=='50886835aae3355080b64f3ef14ddefa0b416eaf'
          assert final['evidence_subject']['workflow_run']==31774015616
          assert final['evidence_subject']['conclusion']=='SUCCESS'
          for receipt in (candidate, final):
              assert '#401 CANNOT_EXECUTE_MATCHED_EVAL' in receipt['preserved_negatives']
              assert 'CAPABILITY_LIMITED_CAUSAL_CANNOT_IDENTIFY' in receipt['preserved_negatives']
              assert receipt['grants_scientific_authority'] is False
              assert receipt['grants_research_tool_promotion'] is False
          print('P3 closeout dependency-integrity and final-terminal boundary: PASS')
          PY
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile canonical Paper III
        working-directory: publication/papers/paper-03-method-evolution-mechanics
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Enforce warning and identity gates
        working-directory: publication/papers/paper-03-method-evolution-mechanics
        run: |
          test -s main.pdf
          ! grep -E 'Overfull \\[hv]box|Undefined control sequence|LaTeX Warning: Citation .* undefined|LaTeX Warning: Reference .* undefined' main.log
          grep -F 'Method-Evolution Mechanics' main.tex
          grep -F 'PROMOTE_CONDITIONALLY_PRODUCTION_TARGET_VALIDATION_CONSOLIDATION' ../../../research/paper3_publication_closeout_v2/MECHANIC_PROMOTION_MATRIX.json
          grep -F 'PROMOTE_CONDITIONALLY_PAPER3_PUBLICATION_CLOSEOUT' ../../../research/paper3_publication_closeout_v2/FINAL_RECEIPT.json
      - name: Hash release subject
        working-directory: publication/papers/paper-03-method-evolution-mechanics
        run: sha256sum main.tex main.pdf > paper3-release-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper3-publication-closeout-exact-head-v2
          path: |
            publication/papers/paper-03-method-evolution-mechanics/main.pdf
            publication/papers/paper-03-method-evolution-mechanics/main.tex
            publication/papers/paper-03-method-evolution-mechanics/paper3-release-sha256.txt
            research/paper3_publication_closeout_v2/PROTOCOL.json
            research/paper3_publication_closeout_v2/MECHANIC_PROMOTION_MATRIX.json
            research/paper3_publication_closeout_v2/CANDIDATE_RECEIPT.json
            research/paper3_publication_closeout_v2/FINAL_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
