name: paper2-pendulum-microtrial

on:
  push:
    branches:
      - research/paper2-microtrial-harness-20260810
  pull_request:
    branches:
      - main

jobs:
  microtrial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to evaluated subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[test]"
          pip install "jsonschema==4.25.1"
      - name: Verify frozen packet and hostile LUNARC execution contract
        run: |
          pytest -q \
            tests/test_paper2_pendulum_microtrial.py \
            tests/test_paper2_pendulum_microtrial_v4.py \
            tests/test_matched_microtrial.py \
            tests/test_matched_microtrial_preregistration.py \
            tests/test_paper2_empirical_study.py
      - name: Upload frozen engineering artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper2-pendulum-microtrial-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            research/paper2_microtrial_v1/
            research/paper2_microtrial_v4/
            experiments/paper2/lunarc/*v4*
            schemas/paper2-*v4.schema.json
            research/PAPER2_MATCHED_EMPIRICAL_NEXT_ITERATION_V4_STATUS_20260811.md
            research/PAPER2_MICROTRIAL_MANUSCRIPT_STATUS_20260810.md
            research/PAPER2_MICROTRIAL_HOSTILE_REVIEW_20260810.md
          if-no-files-found: error
