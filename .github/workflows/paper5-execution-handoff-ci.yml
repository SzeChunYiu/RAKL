name: paper5-execution-handoff-ci

on:
  push:
    branches:
      - paper5-experience-governed-evolution-20260811
    paths:
      - experiments/paper2/analyze_v3_experience_benchmark.py
      - experiments/paper2/plot_v3_experience_benchmark.py
      - experiments/paper3/plot_confirmatory_metrics.py
      - experiments/paper5/**
      - schemas/paper5-attribution-run-v1.schema.json
      - tests/test_empirical_execution_handoff.py
      - .github/workflows/paper5-execution-handoff-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test and plotting dependencies
        run: python -m pip install pytest matplotlib
      - name: Exercise execution helper round trips
        run: python -m pytest -q tests/test_empirical_execution_handoff.py
      - name: Compile helper entrypoints
        run: |
          python -m py_compile \
            experiments/paper2/analyze_v3_experience_benchmark.py \
            experiments/paper2/plot_v3_experience_benchmark.py \
            experiments/paper3/plot_confirmatory_metrics.py \
            experiments/paper5/build_attribution_schedule.py \
            experiments/paper5/analyze_attribution_results.py \
            experiments/paper5/plot_attribution_results.py \
            experiments/paper5/analyze_novelty_audit.py \
            experiments/paper5/plot_novelty_audit.py \
            experiments/paper5/plot_longitudinal_metrics.py \
            experiments/paper5/analyze_process_telemetry.py \
            experiments/paper5/plot_process_dashboard.py
