name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to evaluated subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Run tests and capture exact passing count
        shell: bash
        run: |
          set -euo pipefail
          pytest | tee pytest.log
          TEST_COUNT="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pytest.log').read_text(encoding='utf-8')
          matches = re.findall(r'(\d+) passed', text)
          if len(matches) != 1:
              raise SystemExit(f'could not identify unique passing-test count: {matches}')
          print(matches[0])
          PY
          )"
          echo "RAKL_SOFTWARE_TESTS=$TEST_COUNT" >> "$GITHUB_ENV"
      - name: Emit deterministic lattice metrology receipt
        run: python -m rakl.mini_research_metrology
      - name: Emit deterministic archive storage receipt
        run: python -m rakl.mini_archive_demo
      - name: Generate receipt-bound publication figures
        run: python paper/generate_demo_figures.py
      - name: Stage exact-subject V2.1 manuscript
        shell: bash
        run: |
          set -euo pipefail
          python paper/build_v2_1_source.py \
            --stage paper/build/v2_1 \
            --subject-sha "$GITHUB_SHA" \
            --software-tests "$RAKL_SOFTWARE_TESTS"
          grep -F "\\newcommand{\\SoftwareTests}{$RAKL_SOFTWARE_TESTS}" paper/build/v2_1/main.tex
          grep -F "\\newcommand{\\ImplementationSHA}{\\texttt{$GITHUB_SHA}}" paper/build/v2_1/main.tex
      - name: Install manuscript build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            lmodern \
            poppler-utils
      - name: Compile and preflight V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          cd paper/build/v2_1
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          test -s main.pdf
          pdfinfo main.pdf | tee pdfinfo.txt
          pdffonts main.pdf | tee pdffonts.txt
          if grep -E "Overfull \\[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined" main.log; then
            echo "Blocking LaTeX/PDF warning detected" >&2
            exit 1
          fi
          mkdir -p renders
          pdftoppm -png -r 160 main.pdf renders/page >/dev/null
          test "$(find renders -maxdepth 1 -name 'page-*.png' | wc -l)" -gt 0
      - name: Upload V2.1 publication review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-1-publication-review-${{ github.sha }}
          path: |
            paper/build/v2_1/main.tex
            paper/build/v2_1/main.pdf
            paper/build/v2_1/main.log
            paper/build/v2_1/latexmk.stdout.log
            paper/build/v2_1/pdfinfo.txt
            paper/build/v2_1/pdffonts.txt
            paper/build/v2_1/renders/*.png
            paper/build/v2_1/fig5_demo_growth.pdf
            paper/build/v2_1/fig6_demo_context.pdf
            paper/figures/generated/*.svg
            paper/figures/generated/*.source.json
          if-no-files-found: error
