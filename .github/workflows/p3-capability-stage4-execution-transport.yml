name: p3-capability-stage4-execution-transport

on:
  push:
    branches:
      - automation/p3-stage4-execution-transport-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execution-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate shell and frozen scientific blobs
        run: |
          bash -n experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v1.sh
          bash experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v1.sh \
            preflight "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE"
      - name: Simulate exact submission and successful harvest without model outputs
        run: |
          mkdir -p /tmp/fakebin
          cat >/tmp/fakebin/sbatch <<'SH'
          #!/usr/bin/env bash
          echo '424242;fakecluster'
          SH
          cat >/tmp/fakebin/sacct <<'SH'
          #!/usr/bin/env bash
          echo 'COMPLETED|'
          SH
          chmod +x /tmp/fakebin/sbatch /tmp/fakebin/sacct
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v1.sh
          bash "$SCRIPT" submit "$SUBJECT" "$GITHUB_WORKSPACE"
          mkdir -p research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242/FINAL_CAPABILITY_RECEIPT.json')
          p.write_text(json.dumps({
            'schema_version':'rakl-capability-qualification-stage5-result-v1',
            'terminal':'DIAGNOSTIC_OVERFIT_OR_INSUFFICIENT_CAPABILITY',
            'model':{'revision':'a09a35458c702b33eeacc393d103063234e8bc28'},
            'panel_sha256':'0ab994fb0f8f3523014023ff703151afe4c66e86a8f030435f509d141055cc0e',
            'model_substitution_performed':False,
            'grants_scientific_authority':False,
            'all_132_cases_completed':True,
          }, sort_keys=True)+'\n')
          PY
          bash "$SCRIPT" harvest 424242 "$SUBJECT" "$GITHUB_WORKSPACE"
          test -f research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/EXECUTION_TRANSPORT/HARVEST_424242.json
      - name: Hostile harvest mutations must fail closed
        run: |
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper3/lunarc/submit_and_harvest_capability_stage4_v1.sh
          RAW=research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242/FINAL_CAPABILITY_RECEIPT.json
          cp "$RAW" /tmp/good.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['panel_sha256']='0'*64; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 424242 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'panel mutation escaped' >&2; exit 1; fi
          cp /tmp/good.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['model']['revision']='wrong'; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 424242 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'model mutation escaped' >&2; exit 1; fi
          cp /tmp/good.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_RUN_424242/FINAL_CAPABILITY_RECEIPT.json')
          x=json.loads(p.read_text()); x['terminal']='MADE_UP_POSITIVE'; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 424242 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'terminal mutation escaped' >&2; exit 1; fi
          cp /tmp/good.json "$RAW"
      - name: Scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION/STAGE4_EXECUTION_TRANSPORT_V1.json').read_text())
          assert p['grants_scientific_authority'] is False
          assert p['grants_model_level_efficacy'] is False
          assert 'EXECUTION_PROVENANCE_ONLY' in p['claim_boundary']
          print('P3 Stage4 execution transport: PASS')
          PY
