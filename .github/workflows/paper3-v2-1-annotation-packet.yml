name: paper3-v2-1-annotation-packet

on:
  push:
    branches:
      - publication/paper3-v2-1-annotation-packet-20260810
  pull_request:
    branches:
      - main

    paths:
      - 'paper/structural_amortization/**'
      - 'src/rakl/**'
      - 'tests/test_paper3_*'
      - 'schemas/paper3-*'
      - 'research/paper3/**'
      - 'research/receipts/PAPER3_*'
      - 'research/PAPER3_*'
      - 'pyproject.toml'
      - '.github/workflows/paper3-v2-1-annotation-packet.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  annotation-packet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to evaluated subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -e ".[test]"
          pip install "jsonschema==4.25.1"
      - name: Verify packet, negative history and CANNOT_CHECK semantics
        run: |
          pytest -q \
            tests/test_paper3_v2_1_annotation_packet.py \
            tests/test_paper3_external_annotation.py \
            tests/test_paper3_v2_source_set_repair.py
      - name: Verify coordinator linkage is not committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E 'PAPER3_LINKAGE_V2_1_20260810.json$'; then
            echo "Coordinator-only linkage must not be committed" >&2
            exit 1
          fi
      - name: Install manuscript build tools (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
          version: 1.3

      - name: Ensure TeX packages (fallback apt)
        run: |
          set -euo pipefail
          if ! kpsewhich lmodern.sty >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              latexmk texlive-latex-extra texlive-fonts-recommended \
              texlive-science lmodern poppler-utils
          fi
          kpsewhich lmodern.sty
          latexmk -v | head -1

      - name: Compile exact Paper 3 v5 manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper/structural_amortization
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main_v5.tex | tee latexmk_v5_annotation_packet.stdout.log
          test -s main_v5.pdf
          if grep -E 'Overfull \[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main_v5.log; then
            echo "Blocking Paper 3 v5 LaTeX/PDF warning detected" >&2
            exit 1
          fi
      - name: Upload exact packet-freeze artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper3-v2-1-annotation-packet-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            research/paper3/annotation/EXTERNAL_ANNOTATION_PACKET_V2_1_20260810.json
            research/paper3/annotation/README_V2_1.md
            research/receipts/PAPER3_V2_1_ANNOTATION_PACKET_FREEZE_20260810.json
            research/receipts/PAPER3_V2_1_ANNOTATION_PACKET_INTERNAL_REVIEW_20260810.json
            paper/structural_amortization/main_v5.pdf
            paper/structural_amortization/main_v5.log
            paper/structural_amortization/latexmk_v5_annotation_packet.stdout.log
          if-no-files-found: error
