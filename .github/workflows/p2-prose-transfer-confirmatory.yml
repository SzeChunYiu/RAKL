name: p2-prose-transfer-confirmatory

on:
  push:
    branches:
      - research/p2-prose-transfer-instrument-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prose-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Confirm no refuted predecessor artifact is edited by this epoch
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          ! grep -qE '^src/rakl/objective_transfer_robustness\.py$' /tmp/changed.txt
          ! grep -qE '^scripts/paper2_robustness_confirmatory\.py$' /tmp/changed.txt
          ! grep -qE '^src/rakl/controlled_witness_extraction\.py$' /tmp/changed.txt
          ! grep -qE '^research/paper2_controlled_witness_extraction_v1/' /tmp/changed.txt
      - name: Instrument invariants
        run: pytest -q tests/test_prose_transfer_instrument_v1.py
      - name: Re-execute the frozen confirmatory
        run: |
          PYTHONPATH=src:. python experiments/paper2/run_prose_transfer_confirmatory_v1.py \
            --out /tmp/p2-prose
      - name: Assert the recorded terminal and the probe-G collapse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fresh = json.loads(Path('/tmp/p2-prose/CONFIRMATORY_RESULT.json').read_text())
          stored = json.loads(Path(
              'research/paper2_prose_transfer_v1/results/CONFIRMATORY_RESULT.json'
          ).read_text())
          assert fresh == stored, 'confirmatory is not deterministic against the stored receipt'

          pg = fresh['probe_g_acceptance_test']
          # The acceptance test: destroying the text must destroy performance.
          assert pg['scrambling_destroys_performance'] is True, pg
          assert pg['clean_full_exact'] - pg['scrambled_full_exact'] > 0.5, pg

          gates = fresh['gates']
          # The registered outcome. G3 fails: all errors fall in one ambiguity
          # class, which is the template-inversion signature the ceiling exists
          # to catch. This is asserted so a future change that alters it must
          # update the receipt rather than silently reinterpret the result.
          assert gates['G1']['passes'] is True
          assert gates['G2']['passes'] is True
          assert gates['G3']['passes'] is False
          assert gates['G4']['passes'] is True
          assert gates['G5']['passes'] is True
          assert gates['G6']['passes'] is True
          assert gates['G7']['passes'] is True
          assert fresh['all_gates_pass'] is False
          assert fresh['terminal'] == 'INSTRUMENT_NOT_PROBATIVE__TEMPLATE_INVERSION'
          assert fresh['grants_scientific_authority'] is False

          # Falsifier demonstration must remain live.
          g7 = gates['G7']
          assert g7['NC1_SCRAMBLED_TEXT_fails_G1'] is True
          assert g7['NC2_SHUFFLED_GOLD_fails_G1'] is True
          assert g7['NC3_TRIVIAL_ARMS_fail_G4'] is True

          # Probe-F repair: every coordinate must be the sole discriminator
          # somewhere, so no arm can be zeroed by construction.
          cov = fresh['sole_discriminator_coverage']
          assert set(cov) == {
              'qoi', 'boundary', 'direction', 'relation', 'precondition', 'effect'
          }, cov
          assert min(cov.values()) > 0, cov
          print('prose-transfer confirmatory:',
                fresh['terminal'],
                '| probe G', pg['clean_full_exact'], '->', pg['scrambled_full_exact'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-prose-transfer-confirmatory-v1
          path: /tmp/p2-prose/CONFIRMATORY_RESULT.json
          if-no-files-found: error
