name: p2-storyanalogy-ordinal-v2

on:
  push:
    branches:
      - automation/p2-storyanalogy-factorized-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ordinal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind frozen science objects
        run: |
          test "$(git rev-parse HEAD:research/paper2_storyanalogy_ordinal_v2/PROTOCOL.json)" = "08aee2c175ee524a556c64027b434de47ee2ddd2"
          test "$(git rev-parse HEAD:experiments/paper2/run_storyanalogy_ordinal_v2.py)" = "1df3edfb29fa6e0f731f5379ac6bf7743529dd4b"
          test "$(git rev-parse HEAD:experiments/paper2/run_storyanalogy_factorized_v1.py)" = "779b4a9fd61bea9ddb624a45a737690774e859ac"
          python - <<'PY'
          import json
          p=json.load(open('research/paper2_storyanalogy_ordinal_v2/PROTOCOL.json'))
          assert p['predecessor_terminal']=='DEVELOPMENT_NEGATIVE_NO_SAFE_THRESHOLD'
          assert p['predecessor_negative_preserved'] is True
          assert p['chronology']['confirmatory_labels_scored_or_used_before_v2_freeze'] is False
          assert p['grants_scientific_authority'] is False
          PY
      - name: Install fixed CPU stack
        run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.6,<1.9'
      - name: Execute ordinal successor
        shell: bash
        run: |
          set +e
          python experiments/paper2/run_storyanalogy_ordinal_v2.py --out /tmp/storyordinal
          rc=$?
          echo "scientific_runner_code=$rc"
          test -s /tmp/storyordinal/FINAL_RECEIPT.json || exit 90
          exit 0
      - name: Validate first-class scientific terminal
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/storyordinal/FINAL_RECEIPT.json'))
          allowed={
            'PROMOTE_CONDITIONALLY_EXTERNAL_HUMAN_ORDINAL_STRUCTURAL_ANALOGY_FACTORISATION_V2',
            'DEVELOPMENT_NEGATIVE_ORDINAL_NO_SAFE_THRESHOLD',
            'INSTRUMENT_NOT_FALSIFIABLE_ORDINAL_V2',
            'NEGATIVE_ORDINAL_NO_RESIDUAL_OVER_DIRECT_TEXT_PARENT',
            'NEGATIVE_ORDINAL_UNSAFE_FALSE_ACCEPT',
            'NEGATIVE_ORDINAL_OVERREFUSES_VALID_ANALOGIES',
            'RESOURCE_BLOCKED'
          }
          assert r['terminal'] in allowed, r['terminal']
          assert r.get('grants_scientific_authority') is False
          print(json.dumps({'terminal':r['terminal'],'calibration':r.get('candidate_calibration'),'confirmatory':r.get('confirmatory'),'falsifiability':r.get('falsifiability')},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p2-storyanalogy-ordinal-v2
          path: /tmp/storyordinal/FINAL_RECEIPT.json
          if-no-files-found: error
