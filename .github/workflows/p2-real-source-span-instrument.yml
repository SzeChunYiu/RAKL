name: p2-real-source-span-instrument

on:
  push:
    branches:
      - automation/p2-real-source-span-instrument-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquisition-instrument:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Enforce source-set identity and candidate-blind surface
        run: pytest -q tests/test_p2_real_source_acquisition_v1.py
      - name: Materialize deterministic acquisition manifests
        run: python scripts/build_p2_real_source_acquisition_v1.py
      - name: Assert no empirical or scientific-authority promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/paper2_real_source_span_v1')
          public=json.loads((root/'CANDIDATE_ACQUISITION_MANIFEST.json').read_text())
          linkage=json.loads((root/'DEVELOPMENT_LINKAGE.json').read_text())
          assert public['item_count']==16
          assert linkage['candidate_visible'] is False
          assert linkage['development_only'] is True
          assert linkage['grants_scientific_authority'] is False
          protocol=json.loads((root/'PROTOCOL.json').read_text())
          assert protocol['current_allowed_terminal']=='INSTRUMENT_ONLY__NO_EMPIRICAL_EXTRACTION_CLAIM'
          assert protocol['grants_scientific_authority'] is False
          print('P2 real-source acquisition instrument: development-only PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-real-source-span-acquisition-v1
          path: |
            research/paper2_real_source_span_v1/CANDIDATE_ACQUISITION_MANIFEST.json
            research/paper2_real_source_span_v1/DEVELOPMENT_LINKAGE.json
          if-no-files-found: error
