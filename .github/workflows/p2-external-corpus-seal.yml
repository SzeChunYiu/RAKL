name: p2-external-corpus-seal

on:
  push:
    branches:
      - automation/p2-external-corpus-seal-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch exact frozen upstream bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-corpora /tmp/p2-seal
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/siyuyuan/scar/3dfc897cf6cc685531edc80ab64f35660403fc6c/release/system_analogy_en.json' \
            -o /tmp/p2-corpora/scar.json
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/orensul/ParallelPARC/5b88971a6ce1ba120e8bc6f78f2b2c8d623dc622/datasets/gold_test_set/gold_set_analogies_w_challenging_distractors_w_randoms.csv' \
            -o /tmp/p2-corpora/propara.csv
      - name: Build sealed public/protected manifests
        run: |
          python scripts/paper2_external_scientific_analogy_acquire.py \
            --scar /tmp/p2-corpora/scar.json \
            --propara /tmp/p2-corpora/propara.csv \
            --outdir /tmp/p2-seal
      - name: Enforce pre-model authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/p2-seal')
          b=json.loads((p/'EXTERNAL_CORPUS_BINDING.json').read_text())
          assert b['sources']['SCAR']['git_blob_sha']=='214464cc4274f1af5a0bc1008a194b133c214e15'
          assert b['sources']['PROPARA_LOGY']['git_blob_sha']=='e6aa2fa366c7da25b6b4f7fcb70b76e79487c7d9'
          assert b['sources']['SCAR']['quarantined_ids']==list(range(1,11))
          assert b['sources']['PROPARA_LOGY']['quarantined_csv_indices']==list(range(0,11))
          assert b['candidate_visible_gold'] is False
          assert b['model_calls_performed']==0
          assert b['grants_scientific_authority'] is False
          assert (p/'PUBLIC_CASE_MANIFEST.jsonl').read_bytes() != (p/'PROTECTED_GOLD_MANIFEST.jsonl').read_bytes()
          print(json.dumps(b, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-external-scientific-analogy-sealed-v1
          path: |
            /tmp/p2-seal/EXTERNAL_CORPUS_BINDING.json
            /tmp/p2-seal/PUBLIC_CASE_MANIFEST.jsonl
            /tmp/p2-seal/PROTECTED_GOLD_MANIFEST.jsonl
          if-no-files-found: error
