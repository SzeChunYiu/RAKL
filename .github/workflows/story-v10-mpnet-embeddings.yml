name: story-v10-mpnet-embeddings
on:
  push:
    branches: [tooling/export-storyanalogy-20260815]
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Acquire exact StoryAnalogy and predecessor partition code
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o StoryAnalogy.csv https://huggingface.co/datasets/JoeyCheng/story_analogy/resolve/main/StoryAnalogy.csv
          test "$(sha256sum StoryAnalogy.csv | awk '{print $1}')" = "a74f1799ec6eec32a1d82aea5e036ac70c39feb298554c05da8382bf1d80319c"
          git clone -q https://github.com/SzeChunYiu/RAKL.git prior
          git -C prior checkout -q b9486371d96cf631091f382ce24e736439293b58
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned embedding stack
        run: python -m pip install 'sentence-transformers==3.0.1' 'numpy>=1.26,<3'
      - name: Generate label-free embeddings at frozen pre-benchmark model revision
        shell: bash
        run: |
          cat > /tmp/embed.py <<'PY'
          import importlib.util, hashlib, json
          from pathlib import Path
          import numpy as np
          from sentence_transformers import SentenceTransformer
          spec=importlib.util.spec_from_file_location('v1','prior/experiments/paper2/run_storyanalogy_factorized_v1.py')
          V=importlib.util.module_from_spec(spec); spec.loader.exec_module(V)
          raw=Path('StoryAnalogy.csv').read_bytes(); assert hashlib.sha256(raw).hexdigest()=='a74f1799ec6eec32a1d82aea5e036ac70c39feb298554c05da8382bf1d80319c'
          rows=V.load_text_rows(raw); assign,components=V.partitions(rows)
          by={p:sorted(i for i,v in assign.items() if v==p) for p in ('DEV','CALIBRATION','CONFIRMATORY')}
          assert {k:len(v) for k,v in by.items()}=={'DEV':14587,'CALIBRATION':4760,'CONFIRMATORY':4941}
          rby={r['idx']:r for r in rows}
          texts=[]; pos={}
          for p in by:
            for i in by[p]:
              for s in (rby[i]['s1'],rby[i]['s2']):
                s=V.norm_text(s)
                if s not in pos: pos[s]=len(texts);texts.append(s)
          rev='58ae3134e6ee1b28fcc971671a15dd0d6f1ba5e8'
          model=SentenceTransformer('sentence-transformers/all-mpnet-base-v2', revision=rev, device='cpu')
          E=model.encode(texts,batch_size=64,show_progress_bar=True,convert_to_numpy=True,normalize_embeddings=True).astype(np.float32)
          out=Path('embeddings');out.mkdir()
          for p in by:
            ids=np.array(by[p],dtype=np.int32); e1=[];e2=[];domains=[]
            for i in by[p]:
              r=rby[i];e1.append(E[pos[V.norm_text(r['s1'])]]);e2.append(E[pos[V.norm_text(r['s2'])]]);domains.append(r['domain'])
            np.savez_compressed(out/f'{p}.npz',idx=ids,e1=np.asarray(e1,np.float32),e2=np.asarray(e2,np.float32),domain=np.asarray(domains,dtype='U32'))
          meta={'schema_version':'storyanalogy-v10-mpnet-public-embeddings-v1','storyanalogy_sha256':hashlib.sha256(raw).hexdigest(),'encoder_repo':'sentence-transformers/all-mpnet-base-v2','encoder_revision':rev,'sentence_transformers_version':'3.0.1','unique_story_texts':len(texts),'partitions':{k:len(v) for k,v in by.items()},'labels_read':False}
          (out/'METADATA.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
          python /tmp/embed.py
          sha256sum embeddings/* | tee embeddings/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: story-v10-mpnet-public-embeddings
          path: embeddings/
          if-no-files-found: error
          compression-level: 1
