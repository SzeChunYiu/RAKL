name: closeout-paper1-diagnostics

on:
  push:
    branches:
      - paper/closeout-epistemic-mechanics-20260810
      - publication/paper1-review-20260810
  pull_request:
    branches:
      - epistemic-mechanics-longform-v1
      - main

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Run affected Python/source tests
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_authority_ledger.py \
            tests/test_epistemic_mechanics_source.py \
            tests/test_epistemic_mechanics_round050_source.py \
            tests/test_epistemic_mechanics_layout.py \
            tests/test_epistemic_saturation.py \
            tests/test_epistemic_saturation_receipt.py \
            tests/test_paper1_round050_review_receipt.py \
            | tee targeted-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|ERROR|E   |AssertionError|ValueError|RuntimeError' targeted-pytest.log | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 targeted pytest::$safe"
            done
            exit "$status"
          fi
      - name: Install manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Build and production-preflight exact Paper 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/build/closeout_epistemic
          python paper/build_epistemic_mechanics.py --output paper/build/closeout_epistemic/main.tex --subject-sha "$(git rev-parse HEAD)" --software-tests 1
          cd paper/build/closeout_epistemic
          set +e
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -n -E '^!|LaTeX Error|Undefined control sequence|Emergency stop|Fatal error|^[^ ]+\.tex:[0-9]+:' main.log || true; } | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 LaTeX::$safe"
            done
            exit "$status"
          fi
          set -e
          pdfinfo main.pdf | tee pdfinfo.txt
          PAGES="$(awk '/^Pages:/ {print $2}' pdfinfo.txt)"
          echo "Paper 1 pages: $PAGES"
          if [ "$PAGES" -lt 20 ]; then
            echo "::error title=Paper 1 preflight::Page count $PAGES is below required 20"
            exit 1
          fi
          if grep -E 'Overfull \\[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main.log; then
            grep -E 'Overfull \\[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main.log | head -60 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 production preflight::$safe"
            done
            for range in '170,184' '488,503' '615,630'; do
              sed -n "${range}p" main.tex | nl -ba | while IFS= read -r line; do
                safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
                echo "::error title=Paper 1 overfull source window::$safe"
              done
            done
            exit 1
          fi
          mkdir -p renders
          pdftoppm -png -r 160 main.pdf renders/page >/dev/null
          RENDERS="$(find renders -maxdepth 1 -name 'page-*.png' | wc -l)"
          if [ "$RENDERS" -ne "$PAGES" ]; then
            echo "::error title=Paper 1 render preflight::Rendered $RENDERS of $PAGES pages"
            exit 1
          fi
