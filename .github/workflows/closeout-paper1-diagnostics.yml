name: closeout-paper1-diagnostics

on:
  push:
    branches:
      - paper/closeout-epistemic-mechanics-20260810
  pull_request:
    branches:
      - epistemic-mechanics-longform-v1

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Run affected Python/source tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_authority_ledger.py tests/test_epistemic_mechanics_source.py | tee targeted-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|ERROR|E   |AssertionError|ValueError|RuntimeError' targeted-pytest.log | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 targeted pytest::$safe"
            done
            exit "$status"
          fi
      - name: Install manuscript build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
      - name: Build exact Paper 1 and expose LaTeX failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/build/closeout_epistemic
          python paper/build_epistemic_mechanics.py --output paper/build/closeout_epistemic/main.tex --subject-sha "$(git rev-parse HEAD)" --software-tests 1
          cd paper/build/closeout_epistemic
          set +e
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            for n in 1312 1313 1314 1315 1316 1317; do
              line="$(sed -n "${n}p" main.tex)"
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 source line ${n}::$safe"
            done
            { grep -n -E '^!|LaTeX Error|Undefined control sequence|Emergency stop|Fatal error|^[^ ]+\.tex:[0-9]+:' main.log || true; } | head -40 | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"; safe="${safe//$'\r'/'%0D'}"; safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Paper 1 LaTeX::$safe"
            done
            tail -80 main.log
            exit "$status"
          fi
