name: local-export-source
on:
  push:
    branches:
      - tooling/local-export-d0e4ac3
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Archive exact parent commit
        run: |
          git archive --format=zip --output=RAKL-main-d0e4ac3.zip HEAD^
      - uses: actions/upload-artifact@v4
        with:
          name: RAKL-main-d0e4ac3
          path: RAKL-main-d0e4ac3.zip
          if-no-files-found: error
