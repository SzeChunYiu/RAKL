name: p3-trajectory-lesson-induction

on:
  push:
    branches:
      - automation/p1-p4-claim-frontier-wave2-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Unit tests for induction/consolidation boundary
        run: >-
          pytest -q
          tests/test_trajectory_lesson_induction.py
          tests/test_experience_learning.py
      - name: Execute corrected fresh v2 panel
        run: python experiments/paper3/run_trajectory_lesson_induction_v2.py --outdir /tmp/p3-trajectory-induction
      - name: Enforce promotion and non-sovereignty boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('research/paper3_trajectory_lesson_induction_v1/INSTRUMENT_HISTORY.json').read_text())
          p=json.loads(Path('research/paper3_trajectory_lesson_induction_v1/PROTOCOL_V2.json').read_text())
          r=json.loads(Path('/tmp/p3-trajectory-induction/FINAL_RECEIPT.json').read_text())
          assert h['v1']['outcomes_accessed'] is False
          assert h['v1']['terminal']=='PREEXEC_INSTRUMENT_DEFECT'
          assert p['outcomes_accessed_before_v2_freeze'] is False
          assert r['all_gates_pass'] is True
          assert r['terminal']=='PROMOTE_TO_MECHANIC_TYPED_TRAJECTORY_TO_CANDIDATE_LESSON'
          assert r['typed']['unsafe_candidate_rate']==0.0
          assert r['typed']['cannot_check_recall']==1.0
          assert r['typed']['negative_history_recall']==1.0
          assert r['composite_simple_parent_information_ceiling']<=0.95
          assert r['all_mutations_caught'] is True
          assert r['grants_scientific_authority'] is False
          print('P3 typed trajectory -> candidate lesson promotion gate: PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-trajectory-lesson-induction-v2
          path: /tmp/p3-trajectory-induction/FINAL_RECEIPT.json
