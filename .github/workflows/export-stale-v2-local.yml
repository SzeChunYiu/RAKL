name: export-stale-v2-local
on:
  push:
    branches: [tooling/stale-data-20260815]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset reader
        run: python -m pip install 'datasets==4.1.1' 'pyarrow>=17,<22'
      - name: Acquire exact revision and bind partitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/public out/protected
          cat > /tmp/export.py <<'PY'
          import hashlib,json,pathlib
          from datasets import load_dataset
          REV='617c51dc200b5ab09970834144c7e51c77959af0'
          ds=load_dataset('STALEproj/STALE',revision=REV,split='train')
          rows=[dict(r) for r in ds]
          assert len(rows)==400, len(rows)
          rows.sort(key=lambda r:hashlib.sha256(str(r['uid']).encode()).hexdigest())
          def norm(x):
            if isinstance(x,dict): return {str(k):norm(v) for k,v in x.items()}
            if isinstance(x,(list,tuple)): return [norm(v) for v in x]
            if hasattr(x,'item'):
              try:return x.item()
              except Exception:pass
            return x
          rows=[norm(r) for r in rows]
          visible=['uid','haystack_session','timestamps','probing_queries']
          gold=['uid','relevant_session_index','M_old','M_new','explanation','type']
          dev=rows[:48]; fresh=rows[48:]
          P=pathlib.Path('out')
          with (P/'development.jsonl').open('w') as f:
            for r in dev:f.write(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n')
          with (P/'public/fresh_public.jsonl').open('w') as f:
            for r in fresh:f.write(json.dumps({k:r.get(k) for k in visible},ensure_ascii=False,sort_keys=True)+'\n')
          with (P/'protected/fresh_gold.jsonl').open('w') as f:
            for r in fresh:f.write(json.dumps({k:r.get(k) for k in gold},ensure_ascii=False,sort_keys=True)+'\n')
          rec={'schema_version':'stale-v2-acquisition-receipt','revision':REV,'n_total':len(rows),'n_development':len(dev),'n_fresh':len(fresh),'first48_consumed_by_prior_epoch':True,'fresh_gold_separated':True,'candidate_visible':visible,'evaluator_only':gold}
          (P/'public/RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          PY
          python /tmp/export.py
          sha256sum out/development.jsonl out/public/* out/protected/* | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stale-v2-development-and-public
          path: |
            out/development.jsonl
            out/public/
            out/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stale-v2-fresh-gold-protected
          path: out/protected/fresh_gold.jsonl
          if-no-files-found: error
