name: p2-controlled-witness-probe-g

on:
  push:
    branches:
      - research/p2-controlled-witness-probe-g-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe-g-controlled-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Confirm the frozen subject is untouched by this audit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main
            BASE="$(git merge-base HEAD origin/main)"
          fi
          git diff --name-only "$BASE"...HEAD > /tmp/changed.txt
          ! grep -qE '^research/paper2_controlled_witness_extraction_v1/' /tmp/changed.txt
          ! grep -qE '^src/rakl/controlled_witness_extraction\.py$' /tmp/changed.txt
          ! grep -qE '^\.github/workflows/p2-controlled-witness-extraction\.yml$' /tmp/changed.txt
      - name: Execute probe G against the controlled-witness instrument
        run: |
          PYTHONPATH=src:. python \
            research/paper2_controlled_witness_extraction_audit_v1/probe_g_controlled_text_inertness.py \
            --out /tmp/p2-probe-g
      - name: Assert the recorded finding still holds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/p2-probe-g/PROBE_G_CONTROLLED_TEXT_INERTNESS.json').read_text())
          t1, t2 = r['t1_text_inertness'], r['t2_serialization_inverse']
          n = r['subject']['n_base_tasks']
          s = r['subject']['n_text_surfaces']
          # The scramble must actually reach the candidate-visible surface, else
          # "unchanged" would be vacuous.
          assert t1['rendered_surface_changed_by_scramble'] == f'{n}/{n}', t1
          assert t1['gold_unchanged_after_text_scramble'] == f'{n}/{n}', t1
          assert t1['full_arm_unchanged_after_text_scramble'] == f'{s}/{s}', t1
          assert t1['natural_language_surface_is_inert'] is True
          assert t2['public_recovered_byte_identical'] == f'{s}/{s}', t2
          assert t2['extractor_is_serialization_inverse'] is True
          # The reproduced arm must match the frozen receipt, else this is a
          # different arm and the refutation would not bind.
          receipt = json.loads(Path(
              'research/paper2_controlled_witness_extraction_v1/FINAL_RECEIPT.json'
          ).read_text())['full_controlled_extractor']
          got = r['reproduced_full_arm']
          for k in ('exact_decision', 'invalid_false_accept', 'cannot_check_recall', 'valid_accept'):
              assert abs(got[k] - receipt[k]) < 1e-12, (k, got[k], receipt[k])
          assert r['grants_scientific_authority'] is False
          print('probe G: controlled-witness text surface is inert; '
                'exact_decision=1.0 is serialization fidelity')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-controlled-witness-probe-g-v1
          path: /tmp/p2-probe-g/PROBE_G_CONTROLLED_TEXT_INERTNESS.json
          if-no-files-found: error
