name: unified-framework-handoff-zip

on:
  push:
    branches:
      - orion/unified-problem-solving-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-handoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test/figure dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          # Pin matplotlib so regenerated figure bytes are comparable against the
          # committed self-contained per-paper copies.
          pip install 'matplotlib==3.11.1'

      - name: Smoke-run the shipped adopter quickstart
        run: |
          set -euo pipefail
          PYTHONPATH=src python examples/unified_solver_quickstart.py | tee quickstart_stdout.txt
          grep -Fx 'QUICKSTART_COMPLETE=true' quickstart_stdout.txt
          grep -Fx 'AUTHORITY_GRANTED=false' quickstart_stdout.txt

      - name: Assemble exact-source and generated-evidence handoff
        env:
          BASE_SHA: 8beb877d0f3ef3504b5ca2fdd02fb99c75ed4c38
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$GITHUB_SHA"

          rm -rf handoff_bundle
          mkdir -p handoff_bundle/source handoff_bundle/generated

          # Exact tracked repository source at the evaluated commit.
          git archive HEAD | tar -x -C handoff_bundle/source

          printf 'repository=SzeChunYiu/RAKL\nbranch=orion/unified-problem-solving-v1\nbase_sha=%s\nhead_sha=%s\n' \
            "$BASE_SHA" "$HEAD_SHA" > handoff_bundle/HANDOFF_SUBJECT.txt
          git log --oneline --decorate "$BASE_SHA"..HEAD > handoff_bundle/COMMITS.txt
          git diff --stat "$BASE_SHA"...HEAD > handoff_bundle/DIFF_STAT.txt
          git diff --binary "$BASE_SHA"...HEAD > handoff_bundle/orion-unified-problem-solving-v1.diff

          # Recompute the development evidence and publication visuals.
          python scripts/audit_unified_framework.py | tee handoff_bundle/generated/unified_framework_audit.txt
          python research/unified_problem_solving_v1/run_known_world_stress.py | tee handoff_bundle/generated/known_world_stress_stdout.txt
          python paper/generate_demo_figures.py

          cp research/unified_problem_solving_v1/results/known_world_stress.json handoff_bundle/generated/
          cp paper/figures/generated/unified_solver_known_world.source.json handoff_bundle/generated/
          for stem in \
            unified_solver_architecture \
            unified_field_amortization \
            unified_local_vs_closed_loop \
            unified_verification_pareto \
            unified_path_quotient; do
            cp "paper/figures/generated/${stem}.pdf" handoff_bundle/generated/
            cp "paper/figures/generated/${stem}.svg" handoff_bundle/generated/
            cp "paper/figures/generated/${stem}.png" handoff_bundle/generated/
            # The papers are self-contained (they compile from their own
            # figures/ directories); the bundle must not ship generated figures
            # that disagree with the committed per-paper copies.
            cmp "paper/figures/generated/${stem}.pdf" \
              "publication/papers/paper-05-verified-discovery-in-mathematics/figures/${stem}.pdf"
            cmp "paper/figures/generated/${stem}.pdf" \
              "publication/papers/paper-06-rakl-scientific-research-engine/source/figures/${stem}.pdf"
          done
          cp quickstart_stdout.txt handoff_bundle/generated/

          # Preserve both the tracked Paper IV source and the corrected build copy.
          cp publication/papers/paper-04-structural-learning-mechanics/main.tex handoff_bundle/generated/PAPER4_TRACKED_MAIN.tex
          python scripts/repair_paper4_generator_defect.py | tee handoff_bundle/generated/paper4_repair_stdout.txt
          cp publication/papers/paper-04-structural-learning-mechanics/main.tex handoff_bundle/generated/PAPER4_PATCHED_MAIN.tex

          cp HANDOFF_UNIFIED_FRAMEWORK.md handoff_bundle/HANDOFF_UNIFIED_FRAMEWORK.md
          cp docs/ORION_UNIFIED_FRAMEWORK_VERIFICATION_LEDGER.md handoff_bundle/ORION_UNIFIED_FRAMEWORK_VERIFICATION_LEDGER.md
          cp research/unified_problem_solving_v1/VERIFICATION_LEDGER.json handoff_bundle/VERIFICATION_LEDGER.json

          find handoff_bundle -type f -print0 | sort -z | xargs -0 sha256sum > handoff_bundle/CHECKSUMS.sha256
          zip -qr "orion-unified-framework-handoff-${HEAD_SHA}.zip" handoff_bundle
          sha256sum "orion-unified-framework-handoff-${HEAD_SHA}.zip" > handoff_zip.sha256
          cat handoff_zip.sha256

      - name: Upload complete handoff ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orion-unified-framework-handoff-${{ github.sha }}
          path: |
            orion-unified-framework-handoff-${{ github.sha }}.zip
            handoff_zip.sha256
          if-no-files-found: error
          retention-days: 90
