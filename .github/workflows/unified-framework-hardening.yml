name: unified-framework-hardening

on:
  pull_request:
    paths:
      - 'src/rakl/operational_map.py'
      - 'src/rakl/path_equivalence.py'
      - 'src/rakl/navigation_quotient.py'
      - 'src/rakl/path_cost.py'
      - 'src/rakl/fieldability.py'
      - 'src/rakl/vtg_hardening.py'
      - 'src/rakl/framework_closure.py'
      - 'src/rakl/mechanic_diagnosis.py'
      - 'src/rakl/solver_compilation.py'
      - 'src/rakl/solution_assembly.py'
      - 'src/rakl/unified_solver_registry.py'
      - 'tests/test_unified_solver_*.py'
      - 'tests/test_vtg_*.py'
      - 'research/unified_problem_solving_v1/**'
      - 'scripts/audit_unified_framework.py'
      - 'scripts/audit_vtg_closure_ledger.py'
      - 'scripts/repair_paper4_generator_defect.py'
      - 'docs/VTG_*.md'
      - 'docs/NATURE_SKILLS_INTEGRATION.md'
      - 'paper/generate_demo_figures.py'
      - 'paper/generate_unified_solver_figures.py'
      - 'publication/PUBLICATION_SERIES_V2.md'
      - 'publication/UNIFIED_PROBLEM_SOLVING_CROSS_PAPER_INTEGRATION.md'
      - 'publication/papers/paper-04-structural-learning-mechanics/**'
      - 'publication/papers/paper-05-verified-discovery-in-mathematics/**'
      - 'publication/papers/paper-06-rakl-scientific-research-engine/**'
      - '.github/workflows/unified-framework-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-and-render:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact evaluated subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "UNIFIED_FRAMEWORK_SHA=${EXPECTED_SHA}" | tee unified_framework_subject.txt
          echo "RAKL_SUBJECT_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test and figure dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run unified framework tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_unified_solver_framework.py \
            tests/test_unified_solver_registry.py \
            tests/test_vtg_closure_contracts.py \
            tests/test_vtg_hardening_contracts.py \
            | tee unified_framework_tests.txt
      - name: Audit canonical ownership and claim boundary
        run: python scripts/audit_unified_framework.py | tee unified_framework_audit.txt
      - name: Audit provenance-bound VTG closure ledger
        run: python scripts/audit_vtg_closure_ledger.py | tee vtg_closure_audit.txt
      - name: Recompute deterministic known-world stress receipt
        run: python research/unified_problem_solving_v1/run_known_world_stress.py
      - name: Regenerate receipt-bound publication figures
        run: python paper/generate_demo_figures.py
      - name: Assert unified figures and sources
        run: |
          set -euo pipefail
          for stem in unified_solver_architecture unified_field_amortization unified_local_vs_closed_loop unified_verification_pareto unified_path_quotient; do
            test -s "paper/figures/generated/${stem}.pdf"
            test -s "paper/figures/generated/${stem}.svg"
            test -s "paper/figures/generated/${stem}.png"
          done
          test -s paper/figures/generated/unified_solver_known_world.source.json
          test -s research/unified_problem_solving_v1/results/known_world_stress.json
          test -s research/unified_problem_solving_v1/results/vtg_closure_audit.json
      - name: Repair Paper IV invalid v1 interpretation
        run: |
          set -euo pipefail
          python scripts/repair_paper4_generator_defect.py
          cp publication/papers/paper-04-structural-learning-mechanics/main.tex research/unified_problem_solving_v1/PAPER4_PATCHED_MAIN.tex
          ! grep -F 'returns a supported negative' publication/papers/paper-04-structural-learning-mechanics/main.tex
          ! grep -F 'obstruction located at the instrument' publication/papers/paper-04-structural-learning-mechanics/main.tex
          grep -F 'generator defect' publication/papers/paper-04-structural-learning-mechanics/main.tex
      - name: Stage Paper VI with canonical legacy figures
        run: |
          set -euo pipefail
          rm -rf build/publication/paper-06
          mkdir -p build/publication
          cp -a publication/papers/paper-06-rakl-scientific-research-engine/source build/publication/paper-06
          for fig in fig5_demo_growth.pdf fig6_demo_context.pdf; do
            test -s "paper/figures/generated/$fig"
            cp -f "paper/figures/generated/$fig" "build/publication/paper-06/$fig"
          done
      - name: Install manuscript tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern poppler-utils
      - name: Compile Paper IV
        working-directory: publication/papers/paper-04-structural-learning-mechanics
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Compile Paper V
        working-directory: publication/papers/paper-05-verified-discovery-in-mathematics
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Compile Paper VI staged canonical source
        working-directory: build/publication/paper-06
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Preflight and render updated papers
        shell: bash
        run: |
          set -euo pipefail
          check_one() {
            local dir="$1"
            local label="$2"
            test -s "$dir/main.pdf"
            test -s "$dir/main.log"
            if grep -E 'LaTeX Warning: Citation .* undefined|LaTeX Warning: Reference .* undefined|There were undefined references|There were undefined citations|Undefined control sequence|Emergency stop|Fatal error|Overfull \\hbox|Package hyperref Warning: Token not allowed in a PDF string' "$dir/main.log"; then
              echo "Blocking LaTeX warning in $label" >&2
              exit 1
            fi
            pdfinfo "$dir/main.pdf" | tee "$dir/unified_pdfinfo.txt"
            pdftotext "$dir/main.pdf" "$dir/unified_main.txt"
            mkdir -p "$dir/unified_renders"
            pdftoppm -png -r 150 "$dir/main.pdf" "$dir/unified_renders/page" >/dev/null
            pages="$(pdfinfo "$dir/main.pdf" | awk '/^Pages:/ {print $2}')"
            rendered="$(find "$dir/unified_renders" -maxdepth 1 -name 'page-*.png' | wc -l)"
            test "$rendered" -eq "$pages"
            grep -F 'Sze Chun Yiu' "$dir/unified_main.txt"
          }
          check_one publication/papers/paper-04-structural-learning-mechanics 'Paper IV'
          check_one publication/papers/paper-05-verified-discovery-in-mathematics 'Paper V'
          check_one build/publication/paper-06 'Paper VI'
          grep -F 'Verified transformation geometry' publication/papers/paper-05-verified-discovery-in-mathematics/unified_main.txt
          grep -F 'Unified problem-solving substrate' build/publication/paper-06/unified_main.txt
          grep -F 'generator defect' publication/papers/paper-04-structural-learning-mechanics/unified_main.txt
      - name: Upload hardening evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-framework-hardening-${{ env.EXPECTED_SHA }}
          path: |
            unified_framework_subject.txt
            unified_framework_tests.txt
            unified_framework_audit.txt
            vtg_closure_audit.txt
            docs/ORION_UNIFIED_FRAMEWORK_VERIFICATION_LEDGER.md
            docs/VTG_MATHEMATICAL_CLOSURE_AUDIT.md
            docs/VTG_TEN_ROUND_ADVERSARIAL_AUDIT.md
            research/unified_problem_solving_v1/VERIFICATION_LEDGER.json
            research/unified_problem_solving_v1/VTG_CLOSURE_LEDGER.json
            research/unified_problem_solving_v1/results/known_world_stress.json
            research/unified_problem_solving_v1/results/vtg_closure_audit.json
            research/unified_problem_solving_v1/PAPER4_PATCHED_MAIN.tex
            paper/figures/generated/unified_*.pdf
            paper/figures/generated/unified_*.svg
            paper/figures/generated/unified_*.png
            paper/figures/generated/unified_solver_known_world.source.json
            publication/papers/paper-04-structural-learning-mechanics/main.pdf
            publication/papers/paper-04-structural-learning-mechanics/main.log
            publication/papers/paper-04-structural-learning-mechanics/unified_main.txt
            publication/papers/paper-04-structural-learning-mechanics/unified_pdfinfo.txt
            publication/papers/paper-04-structural-learning-mechanics/unified_renders/*.png
            publication/papers/paper-05-verified-discovery-in-mathematics/main.pdf
            publication/papers/paper-05-verified-discovery-in-mathematics/main.log
            publication/papers/paper-05-verified-discovery-in-mathematics/unified_main.txt
            publication/papers/paper-05-verified-discovery-in-mathematics/unified_pdfinfo.txt
            publication/papers/paper-05-verified-discovery-in-mathematics/unified_renders/*.png
            build/publication/paper-06/main.pdf
            build/publication/paper-06/main.log
            build/publication/paper-06/unified_main.txt
            build/publication/paper-06/unified_pdfinfo.txt
            build/publication/paper-06/unified_renders/*.png
          if-no-files-found: error
