name: p1-live-model-payload-execution-transport-v2

on:
  push:
    branches:
      - automation/p1-live-payload-execution-transport-v2-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execution-transport-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[test]'
      - name: Validate exact experiment and production subject
        run: |
          bash -n experiments/paper1/lunarc/submit_and_harvest_live_model_payload_v2.sh
          bash experiments/paper1/lunarc/submit_and_harvest_live_model_payload_v2.sh \
            preflight "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE"
      - name: Simulate exact submission and successful negative harvest
        run: |
          mkdir -p /tmp/fakebin
          cat >/tmp/fakebin/sbatch <<'SH'
          #!/usr/bin/env bash
          echo '616161;fakecluster'
          SH
          cat >/tmp/fakebin/sacct <<'SH'
          #!/usr/bin/env bash
          echo 'COMPLETED|'
          SH
          chmod +x /tmp/fakebin/sbatch /tmp/fakebin/sacct
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper1/lunarc/submit_and_harvest_live_model_payload_v2.sh
          bash "$SCRIPT" submit "$SUBJECT" "$GITHUB_WORKSPACE"
          OUT=research/paper1_live_model_payload_assurance_v1/RUN_616161
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          out=Path('research/paper1_live_model_payload_assurance_v1/RUN_616161')
          rows=out/'RAW_RESULTS.jsonl'
          rows.write_text(''.join(json.dumps({'i':i},sort_keys=True)+'\n' for i in range(96)))
          protocol=Path('research/paper1_live_model_payload_assurance_v1/PROTOCOL.json')
          subject=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          receipt={
            'schema_version':'paper1-live-model-payload-assurance-result-v1',
            'panel':{'n':96,'panel_sha256':'5af33abe503d0531f933a37f769932510c76c6144be3d23fc241bd670645ff81'},
            'metrics':{'n':96},
            'terminal':'MODEL_CORPUS_UNDERSTRESSES_GATEWAY__NO_LIVE_HOSTILE_ASSURANCE',
            'model':{'revision':'a09a35458c702b33eeacc393d103063234e8bc28'},
            'subject_git_sha':subject,
            'protocol_sha256':hashlib.sha256(protocol.read_bytes()).hexdigest(),
            'raw_results_sha256':hashlib.sha256(rows.read_bytes()).hexdigest(),
            'grants_scientific_authority':False,
          }
          (out/'FINAL_RECEIPT.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY
          bash "$SCRIPT" harvest 616161 "$SUBJECT" "$GITHUB_WORKSPACE"
          test -f research/paper1_live_model_payload_assurance_v1/EXECUTION_TRANSPORT_V2/HARVEST_616161.json
      - name: Hostile receipt mutations must fail closed
        run: |
          export PATH="/tmp/fakebin:$PATH"
          SUBJECT="$(git rev-parse HEAD)"
          SCRIPT=experiments/paper1/lunarc/submit_and_harvest_live_model_payload_v2.sh
          RAW=research/paper1_live_model_payload_assurance_v1/RUN_616161/FINAL_RECEIPT.json
          cp "$RAW" /tmp/p1-v2-good.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/paper1_live_model_payload_assurance_v1/RUN_616161/FINAL_RECEIPT.json'); x=json.loads(p.read_text()); x['panel']['panel_sha256']='0'*64; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 616161 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'panel mutation escaped' >&2; exit 1; fi
          cp /tmp/p1-v2-good.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/paper1_live_model_payload_assurance_v1/RUN_616161/FINAL_RECEIPT.json'); x=json.loads(p.read_text()); x['subject_git_sha']='0'*40; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 616161 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'subject mutation escaped' >&2; exit 1; fi
          cp /tmp/p1-v2-good.json "$RAW"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/paper1_live_model_payload_assurance_v1/RUN_616161/FINAL_RECEIPT.json'); x=json.loads(p.read_text()); x['terminal']='MADE_UP_POSITIVE'; p.write_text(json.dumps(x)+'\n')
          PY
          if bash "$SCRIPT" harvest 616161 "$SUBJECT" "$GITHUB_WORKSPACE"; then echo 'terminal mutation escaped' >&2; exit 1; fi
          cp /tmp/p1-v2-good.json "$RAW"
      - name: Clean production-ingress drift must be rejected before model execution
        run: |
          # This is the exact residual that the predecessor transport did not bind:
          # change production ingress in a clean successor commit while every
          # frozen experiment/protocol blob remains byte-identical.
          git config user.name 'RAKL adversarial CI'
          git config user.email 'rakl-ci@example.invalid'
          printf '\n# adversarial clean-commit production drift fixture\n' >> src/rakl/driver_learning.py
          git add src/rakl/driver_learning.py
          git commit -m 'test fixture: production ingress drift' >/dev/null
          DRIFT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          t=json.loads(Path('research/paper1_live_model_payload_assurance_v1/EXECUTION_TRANSPORT_V2.json').read_text())
          for path, expected in t['frozen_experiment_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          print('predecessor experiment/protocol identity still unchanged')
          PY
          if bash experiments/paper1/lunarc/submit_and_harvest_live_model_payload_v2.sh preflight "$DRIFT_SHA" "$GITHUB_WORKSPACE"; then
            echo 'production subject drift escaped v2' >&2
            exit 1
          fi
      - name: Authority and claim boundary
        if: always()
        run: |
          # Read from the PR subject, not the adversarial fixture commit.
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper1_live_model_payload_assurance_v1/EXECUTION_TRANSPORT_V2.json').read_text())
          assert p['grants_scientific_authority'] is False
          assert p['fixed_subject']['panel_n']==96
          assert p['fixed_subject']['model_substitution_allowed'] is False
          assert p['fixed_subject']['scientific_settings_changed_from_v1'] is False
          assert 'PRODUCTION_SUBJECT_IDENTITY' in p['claim_boundary']
          print('P1 live-model execution transport v2: PASS')
          PY
