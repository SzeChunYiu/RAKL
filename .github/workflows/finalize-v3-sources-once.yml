name: finalize-v3-sources-once

on:
  push:
    branches:
      - publication/v3-finalize-20260811
    paths:
      - .github/workflows/finalize-v3-sources-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: publication/v3-finalize-20260811
      - name: Apply publication source fixes
        run: python scripts/finalize_v3_sources.py
      - name: Commit finalized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/papers publication/papers
          git diff --cached --quiet && { echo "No source changes to commit"; exit 0; }
          git commit -m "fix(publication): finalize v3 metadata and layout"
          git push origin HEAD:publication/v3-finalize-20260811
