name: p3-capability-stage4-preflight

on:
  push:
    branches:
      - automation/p1-p4-claim-frontier-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate and bind fresh panel before any model execution
        run: python experiments/paper3/run_capability_stage4_v1.py --outdir /tmp/p3-capability-preflight --dry-run
      - name: Check exact panel and frozen vector gate
        run: |
          python - <<'PY'
          import json, hashlib, sys
          from pathlib import Path
          sys.path.insert(0, 'experiments/paper3')
          import build_capability_stage4_panel_v1 as B
          packet=Path('research/empirical_10_of_10_v1/CAPABILITY_QUALIFICATION')
          freeze=json.loads((packet/'STAGE3_5_FREEZE_V1.json').read_text())
          manifest=json.loads((packet/'FRESH_TASK_MANIFEST_V1.json').read_text())
          body=B.serialize(B.build())
          assert hashlib.sha256(body).hexdigest()==manifest['panel_sha256']
          assert len(B.build())==132
          assert freeze['model_candidates'][0]['revision']=='a09a35458c702b33eeacc393d103063234e8bc28'
          assert freeze['interface']['repair_passes']==0
          assert freeze['decision']['pass']=='CAPABLE_MODEL_AUTHORIZE_RECEIPT_V3'
          assert freeze['grants_scientific_authority'] is False
          print('P3 Stage3-5 preflight: PASS')
          PY
      - name: Validate exact LUNARC runner shell
        run: bash -n experiments/paper3/run_capability_stage4_v1_lunarc.sbatch
