name: p4-phase2-execution-provenance-v1

on:
  push:
    branches:
      - automation/p4-phase2-execution-provenance-v1-20260814
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-execution-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test surface
        run: python -m pip install -e '.[test]'
      - name: Verify frozen scientific subject and successor implementation blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          packet=Path('research/paper4_phase2_execution_transport_v1')
          protocol=json.loads((packet/'PROTOCOL.json').read_text())
          binding=json.loads((packet/'IMPLEMENTATION_BINDING.json').read_text())
          assert protocol['chronology']['phase2_model_outputs_accessed_before_freeze'] is False
          assert protocol['scientific_subject_unchanged']['scientific_settings_changed'] is False
          for path, expected in protocol['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          for path, expected in binding['new_transport_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          assert binding['raw_phase2_standalone_flag_non_authoritative'] is True
          assert binding['standalone_paper4_authorized'] is False
          assert protocol['grants_scientific_authority'] is False
          assert binding['grants_scientific_authority'] is False
          print('P4 Phase-2 exact scientific subject + transport implementation: PASS')
          PY
      - name: Validate scientific-terminal / scheduler-state separation
        run: python experiments/training_ladder/validate_phase2_v1_terminal.py --selftest
      - name: Shell syntax and dry-run data instrument
        run: |
          bash -n experiments/training_ladder/run_phase2_v1_lunarc_transport_v1.sbatch
          bash -n experiments/training_ladder/submit_and_harvest_phase2_v1_transport.sh
          tmp="$(mktemp -d)"
          python -m experiments.training_ladder.phase2_adaptive_v1 --outdir "$tmp" --dry-run
          test -s "$tmp/DATA_MANIFEST.json"
          rm -rf "$tmp"
      - name: Run execution-provenance adversarial tests and strongest authority parent
        run: |
          pytest -q \
            tests/test_p4_phase2_execution_transport_v1.py \
            tests/test_phase2_adaptive_receipt_admission.py \
            tests/test_phase2_adaptive_protocol.py
      - name: Assert no standalone/scientific authority from transport
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper4_phase2_execution_transport_v1/PROTOCOL.json').read_text())
          b=json.loads(Path('research/paper4_phase2_execution_transport_v1/IMPLEMENTATION_BINDING.json').read_text())
          assert p['publication_and_authority_boundary']['standalone_gate_remains'].startswith('issue #462')
          assert p['harvest_contract']['harvested_standalone_paper4_authorized'] is False
          assert p['grants_scientific_authority'] is False
          assert b['standalone_paper4_authorized'] is False
          print('P4 transport authority boundary: PASS')
          PY
