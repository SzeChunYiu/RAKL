name: publication-pdfs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-pdfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"

      - name: Run exact-head repository tests
        shell: bash
        run: |
          set -euo pipefail
          pytest | tee pytest.log
          TEST_COUNT="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pytest.log').read_text(encoding='utf-8')
          matches = re.findall(r'(\d+) passed', text)
          if len(matches) != 1:
              raise SystemExit(f'could not identify unique passing-test count: {matches}')
          print(matches[0])
          PY
          )"
          echo "RAKL_SOFTWARE_TESTS=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Install manuscript build tools (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
          version: 1.1

      - name: Generate receipt-bound Paper II figures
        run: |
          python -m rakl.mini_research_metrology
          python -m rakl.mini_archive_demo
          python paper/generate_demo_figures.py

      - name: Stage five release manuscripts from canonical publication/
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          rm -rf build/publication
          mkdir -p build/publication

          # Stage reader-facing packages (not stale paper/ archives).
          cp -a publication/papers/paper-01-epistemic-mechanics build/publication/paper-01
          cp -a publication/papers/paper-02-rakl-evidence-governed-research/source \
            build/publication/paper-02
          cp -a publication/papers/paper-03-directional-structural-witnesses \
            build/publication/paper-03
          mkdir -p build/publication/paper-04
          cp publication/papers/paper-04-verified-discovery/main.tex \
            build/publication/paper-04/main.tex
          cp -a publication/papers/paper-05-experience-governed-evolution \
            build/publication/paper-05

          rm -f build/publication/paper-0*/main.pdf

          for fig in fig5_demo_growth.pdf fig6_demo_context.pdf; do
            if [[ -f "paper/figures/generated/$fig" ]]; then
              cp -f "paper/figures/generated/$fig" "build/publication/paper-02/$fig"
            fi
          done

          python - <<PY
          from pathlib import Path
          sha = "$HEAD_SHA"
          tests = int("$RAKL_SOFTWARE_TESTS")
          p1 = Path("build/publication/paper-01/main.tex")
          text = p1.read_text(encoding="utf-8")
          if r"\newcommand{\ImplementationSHA}{\texttt{UNBOUND}}" not in text:
              raise SystemExit("paper-01 missing UNBOUND ImplementationSHA anchor")
          if r"\newcommand{\SoftwareTests}{UNBOUND}" not in text:
              raise SystemExit("paper-01 missing UNBOUND SoftwareTests anchor")
          text = text.replace(
              r"\newcommand{\ImplementationSHA}{\texttt{UNBOUND}}",
              rf"\newcommand{{\ImplementationSHA}}{{\texttt{{{sha}}}}}",
              1,
          )
          text = text.replace(
              r"\newcommand{\SoftwareTests}{UNBOUND}",
              rf"\newcommand{{\SoftwareTests}}{{{tests}}}",
              1,
          )
          if r"\section*{Code, materials and AI-use disclosure}" not in text:
              raise SystemExit("paper-01 missing AI-use disclosure")
          p1.write_text(text, encoding="utf-8")
          Path("build/publication/paper-02/build_identity.tex").write_text(
              "\\newcommand{\\SoftwareTests}{%d}\n"
              "\\newcommand{\\ImplementationSHA}{\\texttt{%s}}\n"
              % (tests, sha),
              encoding="utf-8",
          )
          PY

      - name: Require author metadata and AI-use disclosures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          required_meta = ("Sze Chun Yiu", "Stockholm University", "sze-chun.yiu@fysik.su.se")
          disclosure_files = {
              "paper-01": None,
              "paper-02": "sections/16_reproducibility_ai_use.tex",
              "paper-03": None,
              "paper-04": None,
              "paper-05": None,
          }
          disclosure_needles = {
              "paper-01": r"\section*{Code, materials and AI-use disclosure}",
              "paper-02": r"\section*{Reproducibility and AI-use statement}",
              "paper-03": r"\section*{Code, materials and AI-use disclosure}",
              "paper-04": r"\section*{Code, materials and AI-use disclosure}",
              "paper-05": r"\section*{Code, data, materials and AI-use disclosure}",
          }
          for paper, needle in disclosure_needles.items():
              path = Path(f"build/publication/{paper}/main.tex")
              raw = path.read_text(encoding="utf-8")
              blob = raw
              extra = disclosure_files[paper]
              if extra is not None:
                  blob += "\n" + (path.parent / extra).read_text(encoding="utf-8")
              if needle not in blob:
                  raise SystemExit(f"{paper} missing AI-use disclosure")
              for required in required_meta:
                  if required not in raw:
                      raise SystemExit(f"{paper} author metadata missing: {required}")
          PY

      - name: Compile and preflight all five PDFs
        shell: bash
        run: |
          set -euo pipefail
          for paper in paper-01 paper-02 paper-03 paper-04 paper-05; do
            dir="build/publication/$paper"
            echo "=== $paper ==="
            (
              cd "$dir"
              latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee latexmk.stdout.log
              test -s main.pdf
              pdfinfo main.pdf | tee pdfinfo.txt
              pdffonts main.pdf | tee pdffonts.txt
              pdftotext main.pdf main.txt
              if grep -E 'Overfull \\[hv]box|Float too large|Undefined control sequence|There were undefined references|Citation .* undefined|Reference .* undefined' main.log; then
                echo "Blocking LaTeX/PDF warning in $paper" >&2
                exit 1
              fi
              grep -F 'Sze Chun Yiu' main.txt
              grep -F 'Stockholm University' main.txt
              grep -F 'sze-chun.yiu@fysik.su.se' main.txt
              mkdir -p renders
              pdftoppm -png -r 160 main.pdf renders/page >/dev/null
              pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
              test "$pages" -ge 1
              test "$(find renders -maxdepth 1 -name 'page-*.png' | wc -l)" -eq "$pages"
            )
          done

      - name: Upload canonical publication build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-publication-pdfs-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            pytest.log
            build/publication/paper-01/main.tex
            build/publication/paper-01/main.pdf
            build/publication/paper-01/main.log
            build/publication/paper-01/pdfinfo.txt
            build/publication/paper-01/pdffonts.txt
            build/publication/paper-01/main.txt
            build/publication/paper-01/renders/*.png
            build/publication/paper-02/main.tex
            build/publication/paper-02/main.pdf
            build/publication/paper-02/main.log
            build/publication/paper-02/pdfinfo.txt
            build/publication/paper-02/pdffonts.txt
            build/publication/paper-02/main.txt
            build/publication/paper-02/renders/*.png
            build/publication/paper-03/main.tex
            build/publication/paper-03/main.pdf
            build/publication/paper-03/main.log
            build/publication/paper-03/pdfinfo.txt
            build/publication/paper-03/pdffonts.txt
            build/publication/paper-03/main.txt
            build/publication/paper-03/renders/*.png
            build/publication/paper-04/main.tex
            build/publication/paper-04/main.pdf
            build/publication/paper-04/main.log
            build/publication/paper-04/pdfinfo.txt
            build/publication/paper-04/pdffonts.txt
            build/publication/paper-04/main.txt
            build/publication/paper-04/renders/*.png
            build/publication/paper-05/main.tex
            build/publication/paper-05/main.pdf
            build/publication/paper-05/main.log
            build/publication/paper-05/pdfinfo.txt
            build/publication/paper-05/pdffonts.txt
            build/publication/paper-05/main.txt
            build/publication/paper-05/renders/*.png
          if-no-files-found: error
