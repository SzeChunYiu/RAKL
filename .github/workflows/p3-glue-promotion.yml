name: p3-glue-promotion

on:
  push:
    branches:
      - automation/p3-glue-rejection-v1-20260814
  pull_request:
    branches:
      - automation/p3-typed-rejection-v1-20260814

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Bind exact subject
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run frozen P3 routing promotion suites
        run: >-
          pytest -q
          tests/test_semantic_shortcut_router_v3.py
          tests/test_semantic_shortcut_router_v2.py
          tests/test_semantic_shortcut_router.py
          tests/test_semantic_shortcut.py
          tests/test_math_research_runtime.py
      - name: Preserve authority boundary
        run: >-
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/paper3_glue_rejection_production_v1/PROTOCOL.json').read_text())
          assert p['promotion_if_green']=='PROMOTE_CONDITIONALLY_PRODUCTION_GLUE_REJECTION_FALLTHROUGH'
          assert 'model-level continual-research performance lift' in p['remaining_nonclaims']
          print('P3 promotion boundary: PASS')
          PY
