name: stale-v3-mpnet-embeddings
on:
  push:
    branches: [tooling/stale-data-20260815]
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned stack
        run: python -m pip install 'datasets==4.1.1' 'sentence-transformers==3.0.1' 'numpy>=1.26,<3'
      - name: Generate label-free query/session embeddings at frozen revision
        shell: bash
        run: |
          cat > /tmp/embed_stale.py <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import numpy as np
          from datasets import load_dataset
          from sentence_transformers import SentenceTransformer
          DATA_REV='617c51dc200b5ab09970834144c7e51c77959af0'
          MODEL_REV='58ae3134e6ee1b28fcc971671a15dd0d6f1ba5e8'
          ds=load_dataset('STALEproj/STALE',revision=DATA_REV,split='train')
          rows=[dict(r) for r in ds]; assert len(rows)==400
          rows.sort(key=lambda r:hashlib.sha256(str(r['uid']).encode()).hexdigest())
          def user_surface(sess):
            vals=[]
            for msg in sess:
              if isinstance(msg,dict) and str(msg.get('role','')).lower()=='user': vals.append(str(msg.get('content','')))
            return re.sub(r'\s+',' ',' '.join(vals)).strip()
          texts=[];pos={}
          def add(s):
            s=re.sub(r'\s+',' ',str(s)).strip()
            if s not in pos:pos[s]=len(texts);texts.append(s)
            return pos[s]
          manifests=[]
          for r in rows:
            q=r['probing_queries'];qids=[add(q[k]) for k in ('dim1_query','dim2_query','dim3_query')]
            sids=[add(user_surface(s)) for s in r['haystack_session']]
            manifests.append((str(r['uid']),qids,sids))
          model=SentenceTransformer('sentence-transformers/all-mpnet-base-v2',revision=MODEL_REV,device='cpu')
          E=model.encode(texts,batch_size=64,show_progress_bar=True,convert_to_numpy=True,normalize_embeddings=True).astype(np.float32)
          out=Path('out');out.mkdir()
          for name,rr in [('DEV',manifests[:48]),('FRESH_PUBLIC',manifests[48:])]:
            u=[];q=[];s=[];lens=[]
            for uid,qids,sids in rr:
              u.append(uid);q.append(E[qids]);s.append(E[sids]);lens.append(len(sids))
            assert len(set(lens))==1 and lens[0]==50
            np.savez_compressed(out/f'{name}.npz',uid=np.asarray(u,dtype='U64'),q=np.asarray(q,np.float32),s=np.asarray(s,np.float32))
          meta={'schema_version':'stale-v3-mpnet-public-embeddings-v1','dataset_revision':DATA_REV,'encoder_repo':'sentence-transformers/all-mpnet-base-v2','encoder_revision':MODEL_REV,'development_n':48,'fresh_public_n':352,'sessions_per_scenario':50,'queries_per_scenario':3,'labels_read':False,'surface':'user-role messages only'}
          (out/'METADATA.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
          python /tmp/embed_stale.py
          sha256sum out/* | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stale-v3-mpnet-public-embeddings
          path: out/
          if-no-files-found: error
          compression-level: 1
