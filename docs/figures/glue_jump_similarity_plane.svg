<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect x="0" y="0" width="1100" height="720" fill="white"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">RAKL similarity space: conservative GLUE and adventurous JUMP</text>
  <text x="550" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Conceptual schematic only — axes are not measured values</text>

  <line x1="120" y1="610" x2="1010" y2="610" stroke="black" stroke-width="2"/>
  <line x1="120" y1="610" x2="120" y2="110" stroke="black" stroke-width="2"/>
  <line x1="565" y1="610" x2="565" y2="110" stroke="gray" stroke-width="1" stroke-dasharray="7 7"/>
  <line x1="120" y1="360" x2="1010" y2="360" stroke="gray" stroke-width="1" stroke-dasharray="7 7"/>

  <text x="565" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20">Surface / domain similarity →</text>
  <text x="45" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" transform="rotate(-90 45 360)">Witnessed deep structural preservation →</text>

  <rect x="145" y="135" width="385" height="190" fill="none" stroke="black" stroke-width="2"/>
  <text x="337" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold">JUMP</text>
  <text x="337" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Low lexical / domain similarity</text>
  <text x="337" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">High relational / causal / mathematical preservation</text>
  <text x="337" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Candidate analogy → transfer hypothesis → target test</text>
  <text x="337" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Exploratory, never auto-promoted</text>

  <rect x="600" y="135" width="385" height="190" fill="none" stroke="black" stroke-width="3"/>
  <text x="792" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold">GLUE</text>
  <text x="792" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Compatible views / representations</text>
  <text x="792" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">High witnessed overlap at a declared layer</text>
  <text x="792" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Identity / transition map / equivalence evidence required</text>
  <text x="792" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Conservative because false merge corrupts the atlas</text>

  <rect x="145" y="395" width="385" height="180" fill="none" stroke="gray" stroke-width="2"/>
  <text x="337" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold">IRRELEVANT REMOTENESS</text>
  <text x="337" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Low surface similarity</text>
  <text x="337" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Low structural witness strength</text>
  <text x="337" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Distance alone is not creativity</text>

  <rect x="600" y="395" width="385" height="180" fill="none" stroke="gray" stroke-width="2"/>
  <text x="792" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold">SURFACE FALSE FRIEND</text>
  <text x="792" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">High vocabulary / topic overlap</text>
  <text x="792" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16">Weak causal / relational correspondence</text>
  <text x="792" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15">Reject or keep as shallow context only</text>

  <circle cx="300" cy="215" r="8" fill="black"/>
  <circle cx="390" cy="260" r="8" fill="black"/>
  <circle cx="720" cy="210" r="8" fill="black"/>
  <circle cx="850" cy="250" r="8" fill="black"/>
  <circle cx="760" cy="470" r="8" fill="black"/>
  <circle cx="330" cy="490" r="8" fill="black"/>

  <text x="550" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">Primary object = typed mapping witness; scalar similarity is only a projection.</text>
</svg>
