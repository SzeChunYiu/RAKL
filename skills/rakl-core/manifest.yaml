version: 0.6.4

always_load:
  - static/core/principles.md
  - static/core/workflow.md

axes:
  workflow:
    allowed:
      - problem-solving
      - mathematical-research
      - perspective-discovery
      - literature-absorption
      - failure-diagnosis
      - mechanism-invention
      - self-rakl
      - strategy-synthesis
    mappings:
      problem-solving:
        - workflows/problem-solving.md
      mathematical-research:
        - workflows/mathematical-research.md
      perspective-discovery:
        - workflows/perspective-discovery.md
      literature-absorption:
        - workflows/literature-absorption.md
      failure-diagnosis:
        - workflows/failure-diagnosis.md
      mechanism-invention:
        - workflows/mechanism-invention.md
      self-rakl:
        - workflows/self-rakl.md
      strategy-synthesis:
        - workflows/strategy-synthesis.md

routing_hints:
  problem-solving:
    detect: "new question, derive, explain, build model, solve"
  mathematical-research:
    detect: "theorem, conjecture, proof, formalize mathematics, Lean, Isabelle, Coq, new mathematics, mathematical discovery"
  perspective-discovery:
    detect: "missing perspectives, blind spots, broaden viewpoint, repeated search vocabulary, global picture, what facets are missing"
  literature-absorption:
    detect: "papers, literature, repository, prior work, survey, learn, absorb knowledge"
  failure-diagnosis:
    detect: "failed, refuted, residual, mismatch, bug, model does not work, contradictory evidence"
  mechanism-invention:
    detect: "invent mechanism, derive new mathematics, new formalism, construct theory, mechanism closure, unexplained residual, all existing models fail, positive mechanism required"
  self-rakl:
    detect: "improve RAKL, reflect on method, better workflow, research process, router, self-improve"
  strategy-synthesis:
    detect: "decision, strategy, policy, utility, profitability, execution, action selection"

workflow_composition:
  problem-solving:
    recommended_pre_steps:
      - perspective-discovery
    conditional_steps:
      - mathematical-research
      - mechanism-invention
  mathematical-research:
    required_pre_candidate_steps:
      - freeze-atomic-context-fiber
      - map-solved-and-near-solved-analogues
      - run-cross-domain-and-everyday-analogy-scan
      - build-method-transfer-matrix
      - run-role-separated-expert-context-review
      - review-global-failure-experience-lattice
      - record-auditable-pre-candidate-trace
      - hash-chain-trace-chronology
      - freeze-context-and-trace-chronology
    recommended_pre_steps:
      - perspective-discovery
      - literature-absorption
    conditional_steps:
      - failure-diagnosis
      - mechanism-invention
      - self-rakl
  literature-absorption:
    recommended_pre_steps:
      - perspective-discovery
  failure-diagnosis:
    conditional_steps:
      - perspective-discovery
      - mathematical-research
      - mechanism-invention
      - self-rakl
  mechanism-invention:
    recommended_pre_steps:
      - failure-diagnosis
      - perspective-discovery
    conditional_steps:
      - mathematical-research
      - self-rakl

invention_resources:
  typed_lattice: src/rakl/typed_lattice.py
  formalism_ir: src/rakl/formalism.py
  mechanism_compiler: src/rakl/mechanism_compiler.py
  symbolic_discovery: src/rakl/symbolic_discovery.py
  search_controller: src/rakl/search_controller.py
  problem_solving_algebra: src/rakl/problem_solving_algebra.py
  strategy_motifs: src/rakl/strategy_motifs.py
  proof_dag: src/rakl/proof_dag.py
  mathematical_context_gate: src/rakl/math_context.py
  mathematical_research_trace: src/rakl/research_trace.py
  failure_experience_lattice: src/rakl/failure_lattice.py
  metacognitive_gap_auditor: src/rakl/metacognition.py
  mathematical_research_runtime: src/rakl/math_research_runtime.py
  mathematical_research_api: src/rakl/math_research_api.py
  dimensional_oracle: src/rakl/math_oracles.py
  formal_oracles: src/rakl/formal_oracles.py
  mathematical_research_assurance: src/rakl/math_research_assurance.py
  hard_gates: src/rakl/hard_gates.py
  hidden_world_benchmark: src/rakl/invention_benchmark.py

invariants:
  - evidence_before_narrative
  - apple_projection_before_theory_competition
  - context_before_contradiction
  - atomic_context_fiber_before_candidate_generation
  - analogue_method_transfer_before_invention
  - cross_domain_analogy_requires_structural_witness
  - everyday_analogy_is_proposal_only
  - role_separated_expert_context_review_before_candidate
  - same_context_expert_roles_are_not_independent_review
  - global_failure_memory_review_before_new_candidate
  - failure_observation_is_not_automatically_failure_cause
  - local_failure_never_globally_blacklists_a_method
  - method_reuse_requires_scope_or_difference_witness_when_prior_failure_is_relevant
  - only_verified_impossibility_can_globally_block_within_its_registered_scope
  - repeated_unclassified_failures_may_open_ontology_or_method_basis_gap
  - context_packet_chronology_precedes_candidate
  - auditable_research_trace_precedes_candidate
  - research_trace_hash_chain_is_tamper_evident
  - every_material_step_records_state_evidence_residual_and_next_action
  - research_trace_is_decision_record_not_private_chain_of_thought
  - literature_list_is_not_method_transfer_matrix
  - repeated_same_basis_failure_reopens_context
  - normalize_before_multiplying
  - representation_is_not_mechanism
  - llm_is_proposer_not_authority
  - preserve_negative_results
  - negative_candidate_result_is_not_positive_goal_closure
  - persistent_positive_goal_never_licenses_evidence_fabrication
  - no_post_result_threshold_rescue
  - typed_formalism_required_for_certifying_invention
  - typed_lattice_path_required_for_lattice_claims
  - invention_lineage_preserved
  - mechanism_edges_require_formal_interaction_laws_for_certifying_dynamics
  - symbolic_discovery_is_training_only_until_untouched_validation
  - verification_receipt_bound_to_exact_candidate
  - exact_hard_gates_cannot_be_averaged_away
  - search_budget_exhaustion_is_nonterminal
  - same_context_reflection_is_not_independent_review
  - raw_ingestion_does_not_auto_promote_knowledge
  - semantic_saturation_not_paper_count
  - knowledge_saturation_is_not_problem_closure
  - native_residual_reopens_relevant_fiber
  - planning_path_never_mints_terminal_authority
  - terminal_problem_closure_requires_verified_certificate
  - operator_composition_is_partial_and_typed
  - strategy_motifs_are_reusable_paths_not_authority
  - proof_dependency_cycles_are_rejected
  - verified_lemma_checkpoint_requires_exact_proof_receipt
  - refuted_proof_nodes_remain_negative_history
  - computational_support_never_promotes_to_theorem
  - formal_proof_requires_statement_alignment
  - proof_dependencies_must_be_audited
  - generated_proofs_require_isolated_recheck_for_strict_assurance
  - machine_proven_never_implies_novel
  - new_math_claim_requires_bounded_novelty_certificate
  - novelty_is_defeasible_as_corpus_expands
  - verified_checkpoints_convert_generator_error_into_search_cost_not_truth_authority

schemas:
  projection: ../../schemas/projection.schema.json
  knowledge_fiber: ../../schemas/knowledge-fiber.schema.json
  typed_lattice: ../../schemas/typed-lattice.schema.json
  formalism: ../../schemas/formalism.schema.json
  mathematical_context_fiber: ../../schemas/math-context-fiber.schema.json
  mathematical_research_trace: ../../schemas/math-research-trace.schema.json
  failure_experience_lattice: ../../schemas/failure-experience-lattice.schema.json
