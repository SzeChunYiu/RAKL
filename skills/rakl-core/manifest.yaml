version: 0.2.0

always_load:
  - static/core/principles.md
  - static/core/workflow.md

axes:
  workflow:
    allowed:
      - problem-solving
      - perspective-discovery
      - literature-absorption
      - failure-diagnosis
      - self-rakl
      - strategy-synthesis
    mappings:
      problem-solving:
        - workflows/problem-solving.md
      perspective-discovery:
        - workflows/perspective-discovery.md
      literature-absorption:
        - workflows/literature-absorption.md
      failure-diagnosis:
        - workflows/failure-diagnosis.md
      self-rakl:
        - workflows/self-rakl.md
      strategy-synthesis:
        - workflows/strategy-synthesis.md

routing_hints:
  problem-solving:
    detect: "new question, derive, explain, build model, solve, prove, formalize"
  perspective-discovery:
    detect: "missing perspectives, blind spots, broaden viewpoint, repeated search vocabulary, global picture, what facets are missing"
  literature-absorption:
    detect: "papers, literature, repository, prior work, survey, learn, absorb knowledge"
  failure-diagnosis:
    detect: "failed, refuted, residual, mismatch, bug, model does not work, contradictory evidence"
  self-rakl:
    detect: "improve RAKL, reflect on method, better workflow, research process, router, self-improve"
  strategy-synthesis:
    detect: "decision, strategy, policy, utility, profitability, execution, action selection"

workflow_composition:
  problem-solving:
    recommended_pre_steps:
      - perspective-discovery
  literature-absorption:
    recommended_pre_steps:
      - perspective-discovery
  failure-diagnosis:
    conditional_steps:
      - perspective-discovery

invariants:
  - evidence_before_narrative
  - apple_projection_before_theory_competition
  - context_before_contradiction
  - normalize_before_multiplying
  - representation_is_not_mechanism
  - llm_is_proposer_not_authority
  - preserve_negative_results
  - no_post_result_threshold_rescue
  - same_context_reflection_is_not_independent_review
  - raw_ingestion_does_not_auto_promote_knowledge
  - semantic_saturation_not_paper_count
  - knowledge_saturation_is_not_problem_closure
  - native_residual_reopens_relevant_fiber

schemas:
  projection: ../../schemas/projection.schema.json
  knowledge_fiber: ../../schemas/knowledge-fiber.schema.json
