[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakl"
version = "0.1.0"
description = "Recursive Atomic Knowledge Lattice research operating system"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.25,<5"]
authors = [{name = "RAKL contributors"}]
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rakl.schemas" = ["*.json"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
