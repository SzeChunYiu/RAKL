question: >-
  Identify and falsify the weakest zeta-specific mechanism capable of proving
  or propagating Li positivity uniformly for every coefficient index n,
  preferably through a prime-side or explicit-formula representation with a
  rigorous tail/uniformity bound, without assuming RH-equivalent zero-location
  information.

opened_by:
  calibration_id: CAL-RH-LI-PREFIX-001
  failure_id: F-RH-ANA-001-FINITE-LI-PREFIX
  trace_event_id: RH-ANA-001-E10

known_boundary:
  - Li's exact criterion is an all-index positivity statement; a finite prefix is not the root statement.
  - The exact synthetic quartet calibration has Lambda_n > 0 for 1 <= n <= 626 and Lambda_627 < 0.
  - The quartet is not the zeta zero set and supplies no evidence that zeta has an off-critical zero.
  - Functional-equation/conjugation symmetry alone is therefore insufficient for prefix-to-global propagation in the calibrated multiset scope.
  - Any useful successor must add explicitly zeta-specific arithmetic/analytic structure and prove how it controls all remaining indices.

candidate_generation_gate:
  allowed: false
  reason: >-
    RH-ANA-002 is a newly opened child atom. Freeze a fresh MathContextFiber,
    method-transfer/analogy review, same-context expert review, dual memory
    review including the RH-ANA-001 failure/tool, and hash-chained pre-candidate
    trace before proposing any inequality, recurrence, tail theorem, or other
    mathematical candidate.

next_pre_candidate_discriminators:
  - Compare Li, Weil-explicit-formula and prime-side representations for the exact location of the all-index/tail obligation.
  - Search primary literature for zeta-specific recurrences, asymptotics or coefficient transforms with uniform error control, recording hidden RH-equivalent assumptions.
  - Use T-RH-LI-PREFIX-QUARTET-CALIBRATION as a scoped known-answer falsifier for any proposed finite-prefix surrogate.
  - Distinguish genuine propagation/coercivity from merely computing or estimating a longer finite prefix.

