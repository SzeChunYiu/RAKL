    depends_on: [O9a]
    reason: "balanced expansion often yields perfect matchings, while C007 then gives an explicit ceil(log2 N) canonical cover"
  - id: O9d
    target: "implement a tiny exact full-semi-filter cover oracle and test whether full cover can exceed canonical cover"
