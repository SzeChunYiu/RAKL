root:
  id: R0
  claim: "P != NP"
  status: OPEN

bridges:
  - id: B1
    claim: "SAT notin P/poly implies P != NP"
    status: ESTABLISHED_STANDARD_BRIDGE_PENDING_FORMALIZATION
  - id: B2
    claim: "an explicit NP-complete language with superpolynomial general circuit complexity implies P != NP"
    status: ESTABLISHED_STANDARD_BRIDGE_PENDING_FORMALIZATION

active_obligations:
  - id: O1
    target: "maintain a primary-source frontier refresh through the current cutoff"
    route: literature-absorption
    status: ACTIVE
  - id: O2
    target: "formalize B1 and B2 in the proof DAG with exact uniform/nonuniform definitions"
    route: mathematical-research
    status: OPEN
  - id: O3
    target: "validate exact small-circuit state-graph oracle"
    route: R003
    status: DEFERRED
  - id: O4
    target: "synthesize and falsify compressed 1-Lipschitz state potentials"
    route: R003
    status: DEFERRED
    depends_on: [O3]
  - id: O5
    target: "apply surviving potentials to small structured monotone targets and measure negation advantage"
    route: R001+R003
    status: DEFERRED
    depends_on: [O4]
  - id: O6
    target: "bind the exact MCSP small-threshold magnification theorem and high-threshold lower-bound theorem"
    route: R002
    status: SOURCE_BOUND
  - id: O6a
    target: "prune threshold transports that preserve exponential circuit complexity while expanding variables"
    route: R002
    status: PROOF_DRAFT_NEGATIVE_CHECKPOINT
    artifacts: [C002, C003]
  - id: O6b
    target: "construct or refute ordinary multi-copy/direct-product MCSP transports"
    route: R002
    status: PROOF_DRAFT_NEGATIVE_CHECKPOINT
    depends_on: [O6a]
    artifacts: [C004]
    residual: C004-R1
  - id: O6c
    target: "investigate genuinely non-black-box or Gap-MCSP complexity amplification with a frozen two-sided boundary theorem"
    route: R002
    status: OPEN
    depends_on: [O6b]
  - id: O6d
    target: "investigate direct high-threshold hardness magnification using a non-local technique"
    route: R002
    status: OPEN
    depends_on: [O6b]
  - id: O7
    target: "formalize any nontrivial surviving lemma and produce an exact proof receipt"
    route: assurance
    status: OPEN
  - id: O8
    target: "three isolated mathematical reviews on any candidate promoted above VERIFIED_LEMMA"
    route: review
    status: OPEN
  - id: O9
    target: "attack unrestricted circuit lower bounds through two-dimensional graph cover complexity"
    route: R004
    status: ACTIVE_FULL_COVER_ONLY
    source: "Cavalar-Oliveira ECCC TR25-033 / ACM TOCT 17(2), 2025"
  - id: O9a
    target: "calibrate exact canonical-cover search against G_NEQ"
    route: R004-canonical
    status: CI_VERIFIED_CALIBRATION
    artifacts: [C005, C006, C007, canonical_cover_oracle]
  - id: O9b
    target: "find an explicit graph family with super-logarithmic canonical cover complexity"
    route: R004-canonical
    status: REFUTED_BY_C009
    depends_on: [O9a]
    artifacts: [C007, C009]
  - id: O9b1
    target: "prune canonical candidates whose complement has a perfect matching"
    route: R004-canonical
    status: SUBSUMED_BY_C009
    artifacts: [C007, C009, perfect_matching_canonical_cover_pairs, matching_number_canonical_cover_pairs]
  - id: O9b2
    target: "search Hall-deficient explicit complement families for super-logarithmic canonical cover complexity"
    route: R004-canonical
    status: REFUTED_BY_C009
    depends_on: [O9b1]
    reason: "C009 gives rho_can(G) <= ceil(log2 nu(G^c)) <= ceil(log2 N); Hall deficiency cannot exceed the logarithmic ceiling"
  - id: O9c
    target: "derive an expansion/spectral invariant that upper-bounds the number of canonical edge semi-filters covered by one pair"
    route: R004-canonical
    status: RETIRED_IN_ORIGINAL_FORM
    depends_on: [O9a]
    reason: "canonical complexity is globally at most logarithmic by C009, so canonical expansion invariants cannot yield a super-log lower bound"
  - id: O9d
    target: "implement a tiny exact full-semi-filter cover oracle and test whether full cover can exceed canonical cover"
    route: R004-full-cover
    status: PROOF_DRAFT_FINITE_EXACT_CHECKPOINT
    depends_on: [O9a, O9b1]
    artifacts: [C008, full_cover_oracle]
    result: "explicit 3x3 graph has rho_can=1 and full rho=2"
  - id: O9d1
    target: "construct or refute a composition theorem for C008-like gadgets that forces full cover growth without collapsing under cross-gadget pair reuse"
    route: R004-full-cover
    status: REFINED_BY_C010
    depends_on: [O9d]
    artifacts: [C010, block_sum_cover]
    result: "fixed-gadget block-diagonal complement sums admit rho <= sigma(base)+ceil(log2 t); C008 copies admit rho <= 2+ceil(log2 t)"
  - id: O9d2
    target: "construct or refute coupled full-cover products/tensors whose cross-coordinate complement structure defeats global pair multiplexing"
    route: R004-full-cover
    status: REFINED_BY_C011
    depends_on: [O9d1]
    artifacts: [C011, coordinate_product_cover]
    result: "coordinate-factorized complement tensor powers admit rho <= t*sigma(base); C008 tensor powers admit rho <= 2t = O(log N)"
  - id: O9d3
    target: "develop an upper-bound adversary for any proposed coupled composition before attempting an asymptotic lower bound"
    route: R004-full-cover
    status: ACTIVE_SUPPORT
    depends_on: [O9d1]
    discriminator: "attempt pair multiplexing, generator separation, quotient/twin or arbitrary-pullback compression, GF(2)-adjacency-rank screening, maximum-degree/matching ceilings, forest/arboricity ceilings, finite-state aggregation, population-count/symmetry compression, low-dimensional feature codes, non-disjoint overlap reuse, restrictions/projections, and source-level intersection/cyclic constructions first"
  - id: O9d4
    target: "construct or refute globally correlated complement families whose graph membership cannot be witnessed by one coordinate and whose fibres do not factor as coordinate products"
    route: R004-full-cover
    status: REFINED_BY_C012
    depends_on: [O9d2]
    artifacts: [C012, local_parity_cover_ceiling]
    result: "fixed-local parity-correlated families satisfy rho <= t(a+b)+2(t-1)=O(log N); mod-2 inner product satisfies rho <= 3t-2"
  - id: O9d5
    target: "construct or refute growing-global-constraint correlated complements whose best known membership intersection-complexity upper bound is superlinear in coordinate count"
    route: R004-full-cover
    status: REFINED_BY_C013
    depends_on: [O9d4]
    artifacts: [C013, blowup_cover]
    result: "full cover complexity cannot increase under vertex blow-up; rank-k linear syndrome inequality/equality graphs have rho <= k and rho <= 2k-1 respectively, independent of check density"
  - id: O9d6
    target: "construct or refute nonlinear globally correlated graph families that do not collapse to a low-cover quotient under identical-neighbourhood/twin compression"
    route: R004-full-cover
    status: REFINED_BY_C014
    depends_on: [O9d5]
    artifacts: [C013, C014, bounded_degree_cover]
    result: "surviving quotient compression is insufficient: every maximum-degree-Delta bipartite graph satisfies rho <= Delta*(2 ceil(log2 N)+1), so bounded-degree families remain O(log N)"
  - id: O9d7
    target: "construct or refute growing-degree nonlinear globally correlated graph families that survive quotient compression and all explicit logarithmic intersection/cyclic upper bounds"
    route: R004-full-cover
    status: REFINED_BY_C015
    depends_on: [O9d6]
    artifacts: [C015, arboricity_cover]
    result: "growing maximum degree is insufficient: if the graph edge set can be partitioned into `a` forests then rho <= D_intersection <= 4a ceil(log2 N); constant-arboricity families remain O(log N) even with Delta=Theta(N)"
  - id: O9d8
    target: "construct or refute growing-arboricity nonlinear globally correlated graph families that survive quotient, degree, forest, linear, product, and cyclic upper-bound adversaries"
    route: R004-full-cover
    status: REFINED_BY_C016
    depends_on: [O9d7]
    artifacts: [C016, finite_state_cover_ceiling]
    result: "growing arboricity is insufficient: any fixed local-symbol relation aggregated by a fixed DFA has rho=O(log N); Hamming-distance mod 3 has edge arboricity Omega(N) but rho <= 8 log2 N"
  - id: O9d9
    target: "construct or refute globally coupled explicit graph families whose aggregation-state or local-symbol complexity grows with coordinate count and that survive all current logarithmic upper-bound screens"
    route: R004-full-cover
    status: REFINED_BY_C017
    depends_on: [O9d8]
    artifacts: [C017, symmetric_hamming_cover_ceiling]
    result: "growing automaton state is insufficient for XOR-symmetric relations: every arbitrary symmetric function of coordinatewise XOR bits has rho <= 80t=O(log N), including growing-modulus, exact-distance, threshold, and arbitrary Hamming-shell unions"
  - id: O9d10
    target: "construct or refute non-symmetric growing-width globally coupled graph families that preserve coordinate identity and survive quotient, degree, arboricity, finite-state, population-count, linear, product, and cyclic upper-bound adversaries"
    route: R004-full-cover
    status: REFINED_BY_C018
    depends_on: [O9d9]
    artifacts: [C018, gf2_rank_pullback_ceiling]
    result: "every nonzero graph with GF(2) adjacency rank r satisfies rho <= 3r-2 by arbitrary pullback monotonicity to the r-bit inner-product graph; all O(log N)-rank and pure bilinear families are therefore dead as super-log targets"
  - id: O9d11
    target: "construct or refute explicit high-GF(2)-rank, non-symmetric, globally coupled graph families that survive all current full-cover upper-bound adversaries"
    route: R004-full-cover
    status: ACTIVE
    depends_on: [O9d10]
    residual: C018-R1
    discriminator: "require a proved GF(2) adjacency-rank lower bound omega(log N) before cover search; then test arbitrary pullback/quotient compression, degree, arboricity, finite-state, population-count, low-dimensional feature maps, products, pair reuse, and source-level intersection/cyclic constructions"
  - id: O9e
    target: "propagate any surviving asymptotic full/intersection cover lower bound through the exact source transference theorem"
    route: R004-full-cover
    status: OPEN
    depends_on: [O9d11]

negative_checkpoints:
  - id: C002
    result: "dummy-variable padding cannot bridge the MCSP threshold gap because threshold gain and time-exponent expansion cancel"
  - id: C003
    result: "streamable single-copy restriction-recoverable wrappers cannot improve the exponential threshold/length ratio beyond the same cancellation"
  - id: C004
    result: "subexponential black-box copying, including ordinary direct-product/XOR/AND/OR composition, cannot repair the MCSP threshold/length exponent mismatch; even ideal additive direct-sum growth is insufficient"
  - id: C007
    result: "if the complement graph contains a perfect matching then canonical cover complexity is at most ceil(log2 N); regular balanced bipartite complements are therefore dead as super-logarithmic canonical targets"
  - id: C009
    result: "for every square graph, rho_can(G) <= ceil(log2 nu(G^c)) <= ceil(log2 N); the entire super-log canonical lane is impossible"
  - id: C010
    result: "fixed-gadget block-diagonal complement sums cannot amplify full cover complexity beyond sigma(base)+ceil(log2 t); for C008 this is at most 2+ceil(log2 t)"
  - id: C011
    result: "coordinate-factorized complement tensor powers cannot amplify full cover complexity beyond t*sigma(base); fixed-base products therefore stay O(log N)"
  - id: C012
    result: "fixed-local parity aggregation remains easy under source transference: rho <= t(a+b)+2(t-1)=O(log N); in particular the mod-2 inner-product graph has rho <= 3t-2"
  - id: C013
    result: "full graph cover complexity is non-increasing under vertex blow-up; linear syndrome equality/inequality graphs collapse to their rank-k quotient and remain O(log N)"
  - id: C014
    result: "every maximum-degree-Delta bipartite graph has rho <= D_intersection <= Delta*(2 ceil(log2 N)+1); bounded-degree families cannot be super-logarithmic full-cover targets"
  - id: C015
    result: "if a bipartite graph edge set can be partitioned into `a` forests then rho <= D_intersection <= 4a ceil(log2 N); constant-arboricity families remain O(log N) even with linearly growing maximum degree"
  - id: C016
    result: "fixed finite-state aggregation over fixed-cost local pair symbols gives rho <= t(C_h+|Q||Sigma|)=O(log N); Hamming-distance mod 3 has arboricity Omega(N) yet rho <= 8 log2 N"
  - id: C017
    result: "every XOR-symmetric graph G_t(x,y)=S_t(x XOR y), for arbitrary symmetric S_t, has rho <= 80t=O(log N) by explicit complement-carrying population count and weight decoding; growing Hamming moduli do not escape"
  - id: C018
    result: "every nonzero square graph with GF(2) adjacency rank r has rho <= 3r-2 because its adjacency relation is an arbitrary vertex-map pullback of the r-bit inner-product graph; hence O(log N)-rank and all pure bilinear families are logarithmically bounded"

finite_checkpoints:
  - id: C008
    result: "an explicit five-complement-edge 3x3 graph has exact canonical cover number 1 and exact full cover number 2"
    authority: "PROOF_DRAFT_FINITE_EXACT / NOVELTY_UNRESOLVED"
    root_impact: "representation discrimination only; no asymptotic circuit lower bound"

terminal_rule: "Only a verified certificate bound to R0 closes the root."
