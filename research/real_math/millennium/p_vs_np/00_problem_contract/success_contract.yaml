problem_id: millennium-p-vs-np
root_goal: "P != NP"
status: OPEN_NO_SOLUTION_CERTIFICATE

success_requires:
  exact_statement_binding: true
  closed_proof_dag: true
  no_unregistered_axioms: true
  no_placeholders_or_sorries: true
  dependency_audit: true
  isolated_recheck_when_supported: true
  barrier_audit: true
  bounded_novelty_audit: true
  independent_review_count: 3

non_success_states:
  - computational_support_only
  - restricted_model_lower_bound_without_lifting
  - existence_by_counting_without_explicit_np_language
  - proof_of_neighboring_statement
  - same_context_review_only
  - resource_exhaustion

promotion_policy: fail_closed
